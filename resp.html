


<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm loại phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --light: #f8f9fa;
            --dark: #212529;
            --sidebar-width: 250px;
        }
        body { background-color: var(--light); }
        .sidebar {
            background-color: var(--dark);
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-menu { flex: 1; overflow-y: auto; }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
        }
        .sidebar a:hover, .sidebar a.active { background-color: var(--primary); }
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
            min-height: 100vh;
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; }
            .sidebar .header { display: none; }
        }
    </style>
</head>
<body class="bg-light">
<div class="sidebar">
    <div class="header">
        <h3><i class="fas fa-hotel"></i> HotelBooking</h3>
        <p class="mb-0 small">Nguyen Tuong Huyaa - Quản trị</p>
    </div>
    <div class="sidebar-menu">
        <a href="/admin/dashboard"><i class="fas fa-tachometer-alt me-2"></i>Bảng điều khiển</a>
        <a href="/admin/tai-khoan"><i class="fas fa-user-cog me-2"></i>Quản lý tài khoản</a>
        <a class="active" href="/admin/loai-phong"><i class="fas fa-layer-group me-2"></i>Quản lý loại phòng</a>
        <a href="/admin/phong"><i class="fas fa-bed me-2"></i>Quản lý phòng</a>
        <a href="/admin/dich-vu"><i class="fas fa-concierge-bell me-2"></i>Quản lý dịch vụ</a>
    </div>
    <div class="sidebar-footer">
        <a href="/logout" class="btn btn-danger btn-sm w-100">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
    </div>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="fas fa-layer-group me-2"></i>Thêm loại phòng</h2>
        <a href="/admin/loai-phong" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Danh sách
        </a>
    </div>

    

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" action="/admin/loai-phong/them">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên loại phòng <span class="text-danger">*</span></label>
                        <input type="text" name="tenLoai" class="form-control is-invalid" value="" required maxlength="100">
                        
                            <div class="invalid-feedback d-block">Tên loại phòng là bắt buộc.</div>
                        
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Hình ảnh</label>
                        <input type="text" name="hinhAnh" class="form-control " value="" maxlength="255">
                        
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá mặc định <span class="text-danger">*</span></label>
                        <input type="number" name="giaMacDinh" class="form-control is-invalid" value="" min="1" step="0.01" required>
                        
                            <div class="invalid-feedback d-block">Giá mặc định là bắt buộc.</div>
                        
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sức chứa <span class="text-danger">*</span></label>
                        <input type="number" name="sucChua" class="form-control is-invalid" value="" min="1" required>
                        
                            <div class="invalid-feedback d-block">Sức chứa là bắt buộc.</div>
                        
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Diện tích (m²)</label>
                        <input type="number" name="dienTich" class="form-control " value="" min="0.01" step="0.01">
                        
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mô tả</label>
                        <textarea name="moTa" class="form-control " rows="4"></textarea>
                        
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a href="/admin/loai-phong" class="btn btn-outline-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Tạo mới
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
