<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý dịch vụ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Quản lý dịch vụ</h1><p class="text-muted">Quản lý các dịch vụ bổ sung của khách sạn.</p></div><a class="btn btn-primary" th:href="@{/admin/dich-vu/them}"><i class="fas fa-plus"></i> Thêm dịch vụ</a></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" class="row g-2"><div class="col-md-5"><input class="form-control" name="tenDv" th:value="${tenDv}" placeholder="Tên dịch vụ"></div><div class="col-md-2"><button class="btn btn-outline-primary w-100">Tìm kiếm</button></div></form></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Tên dịch vụ</th><th>Đơn giá</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="dv : ${dichVuList}"><td class="fw-semibold" th:text="${dv.tenDv}"></td><td th:text="${dv.donGia}"></td><td><span class="badge bg-success" th:text="${dv.trangThai}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/dich-vu/{id}/sua(id=${dv.maDv})}">Sửa</a><form class="d-inline" method="post" th:action="@{/admin/dich-vu/{id}/xoa(id=${dv.maDv})}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr></tbody></table></div></div></main></body></html>
