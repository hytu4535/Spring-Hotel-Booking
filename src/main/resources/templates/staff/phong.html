<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quản lý phòng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head>
<body class="bg-light"><aside th:replace="~{staff/fragments :: sidebar}"></aside><main class="main-content">
<div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0 text-primary fw-bold"><i class="fas fa-door-open me-2"></i>Quản lý phòng</h2><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_MANAGE_ADD')}" class="btn btn-success fw-semibold" th:href="@{/admin/phong(openCreate=true)}"><i class="fas fa-plus me-1"></i>Thêm phòng mới</a></div>
<div class="card shadow-sm mb-4 border-0"><div class="card-body"><form th:action="@{/staff/phong}" method="get" class="row g-2 align-items-center"><div class="col-md-6"><input type="text" name="soPhong" th:value="${soPhong}" class="form-control" placeholder="Tìm theo số phòng..."></div><div class="col-md-2"><button type="submit" class="btn btn-primary w-100"><i class="fas fa-search me-1"></i>Tra cứu</button></div><div class="col-md-2"><a th:href="@{/staff/phong}" class="btn btn-outline-secondary w-100"><i class="fas fa-rotate-left me-1"></i>Xóa lọc</a></div></form></div></div>
<div class="card shadow-sm border-0"><div class="card-header bg-white py-3 fw-bold text-secondary"><i class="fas fa-list me-2"></i>DANH SÁCH PHÒNG</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-striped table-hover align-middle mb-0"><thead class="table-dark"><tr><th class="text-center" style="width:80px">Mã</th><th>Số phòng</th><th>Loại phòng</th><th class="text-center">Tầng</th><th class="text-center">Trạng thái</th><th>Ghi chú</th><th class="text-center">Thao tác</th></tr></thead><tbody>
<tr th:each="item : ${phongList}"><td class="text-center fw-bold" th:text="${item.maPhong()}"></td><td class="fw-bold text-dark" th:text="${item.soPhong != null ? item.soPhong : item.soPhong()}"></td><td><span class="badge bg-info text-dark" th:text="${(item.tenLoaiPhong != null ? item.tenLoaiPhong : item.tenLoaiPhong()) != null ? (item.tenLoaiPhong != null ? item.tenLoaiPhong : item.tenLoaiPhong()) : 'Chưa xếp'}"></span></td><td class="text-center" th:text="${(item.tang != null ? item.tang : item.tang()) != null ? 'Tầng ' + (item.tang != null ? item.tang : item.tang()) : '-'}"></td><td class="text-center"><span th:if="${item.trangThaiPhong != null and item.trangThaiPhong.name() == 'TRONG'}" class="badge bg-success">Trống</span><span th:if="${item.trangThaiPhong != null and item.trangThaiPhong.name() == 'DA_DAT'}" class="badge bg-warning text-dark">Đã đặt</span><span th:if="${item.trangThaiPhong != null and item.trangThaiPhong.name() == 'DANG_O'}" class="badge bg-danger">Đang ở</span><span th:if="${item.trangThaiPhong != null and item.trangThaiPhong.name() == 'BAO_TRI'}" class="badge bg-secondary">Bảo trì</span></td><td class="text-muted small text-truncate" style="max-width:250px" th:text="${item.ghiChu != null ? item.ghiChu : item.ghiChu()}"></td><td class="text-center"><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_MANAGE_EDIT')}" class="btn btn-sm btn-outline-primary" th:href="@{/admin/phong(editId=${item.maPhong()})}" title="Chỉnh sửa"><i class="fas fa-pen"></i></a><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_MANAGE_DELETE')}" class="btn btn-sm btn-outline-danger ms-1" th:href="@{/admin/phong(deleteId=${item.maPhong()})}" title="Xóa"><i class="fas fa-trash"></i></a></td></tr>
<tr th:if="${#lists.isEmpty(phongList)}"><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-folder-open fa-2x mb-2 d-block"></i>Chưa có dữ liệu phòng nào.</td></tr></tbody></table></div></div></div>
</main></body></html>
