<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chi tiết đơn đặt phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<aside th:if="${isAdminView}" th:replace="~{admin/fragments :: sidebar}"></aside>
<aside th:unless="${isAdminView}" th:replace="~{staff/fragments :: sidebar}"></aside>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2">Chi tiết đơn đặt phòng</h1>
            <p class="text-muted">Mã tra cứu: <strong class="text-primary" th:text="${donDatPhong.maTraCuu}"></strong></p>
        </div>
        <a class="btn btn-outline-secondary" th:href="${bookingBasePath}">← Quay lại</a>
    </div>

    <div class="row g-4">
        <!-- Cột trái: Thông tin -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white py-3 fw-bold"><i class="fas fa-list-ul me-2"></i>Chi tiết phòng đã đặt</div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>Số phòng</th><th>Giá/Đêm</th><th>Số đêm</th><th>Thành tiền</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="ct : ${chiTietList}">
                                <td class="fw-semibold" th:text="${ct.phong.soPhong} + ' (' + ${ct.phong.loaiPhong.tenLoai} + ')'"></td>
                                <td th:text="${#numbers.formatDecimal(ct.giaPhong, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td th:text="${ct.soDem}"></td>
                                <td class="text-primary fw-bold" th:text="${#numbers.formatDecimal(ct.thanhTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- (Kiên sẽ làm phần Dịch vụ phát sinh và Thanh toán ở đây sau) -->
            <div class="alert alert-info"><i class="fas fa-info-circle me-2"></i>Phần Dịch vụ phát sinh & Thanh toán sẽ do member Trung Kiên phụ trách.</div>
        </div>

        <!-- Cột phải: Xử lý trạng thái & Khách hàng -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4 bg-light">
                <div class="card-body">
                    <h5 class="card-title border-bottom pb-2 mb-3">Trạng thái đơn</h5>
                    <div class="mb-3">
                        <span class="badge fs-6" 
                              th:classappend="${donDatPhong.trangThai == 'CHO_XAC_NHAN' ? 'bg-warning text-dark' : (donDatPhong.trangThai == 'DA_HUY' ? 'bg-secondary' : 'bg-success')}" 
                              th:text="${donDatPhong.trangThai}"></span>
                    </div>
                    
                    <form method="post" th:action="${bookingBasePath}">
                        <input type="hidden" name="maDp" th:value="${donDatPhong.maDp}">
                        <input type="hidden" name="action" value="update">
                        <label class="form-label small">Cập nhật trạng thái:</label>
                        <select class="form-select mb-3" name="trangThaiMoi">
                            <option value="DA_XAC_NHAN" th:selected="${donDatPhong.trangThai == 'DA_XAC_NHAN'}">Xác nhận đơn (Khóa phòng)</option>
                            <option value="DA_NHAN_PHONG" th:selected="${donDatPhong.trangThai == 'DA_NHAN_PHONG'}">Khách đã Check-in</option>
                            <option value="DA_TRA_PHONG" th:selected="${donDatPhong.trangThai == 'DA_TRA_PHONG'}">Khách đã Check-out</option>
                            <option value="DA_HUY" th:selected="${donDatPhong.trangThai == 'DA_HUY'}">Hủy đơn</option>
                        </select>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sync-alt me-2"></i>Lưu trạng thái</button>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 fw-bold"><i class="fas fa-user me-2"></i>Thông tin khách hàng</div>
                <div class="card-body">
                    <p class="mb-2"><strong>Họ tên:</strong> <span th:text="${donDatPhong.khachHang.hoTen}"></span></p>
                    <p class="mb-2"><strong>Email:</strong> <span th:text="${donDatPhong.khachHang.email}"></span></p>
                    <p class="mb-2"><strong>SĐT:</strong> <span th:text="${donDatPhong.khachHang.soDienThoai}"></span></p>
                    <p class="mb-0"><strong>Ngày lưu trú:</strong> <br> 
                        <span th:text="${#dates.format(donDatPhong.ngayNhanPhong, 'dd/MM/yyyy')}"></span> 
                        <i class="fas fa-arrow-right mx-1 text-muted"></i> 
                        <span th:text="${#dates.format(donDatPhong.ngayTraPhong, 'dd/MM/yyyy')}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
