<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dịch vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<aside th:replace="~{staff/fragments :: sidebar}"></aside>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Dịch vụ</h1>
            <p class="text-muted mb-0">Tra cứu dịch vụ và đơn giá để phục vụ khách.</p>
        </div>
        <i class="fas fa-concierge-bell fs-2 text-primary"></i>
    </div>
    <form method="get" class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label">Tên dịch vụ</label>
                    <input class="form-control" name="tenDv" th:value="${tenDv}" placeholder="Nhập tên dịch vụ">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary w-100"><i class="fas fa-search me-1"></i> Tìm kiếm</button>
                </div>
            </div>
        </div>
    </form>
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Tên dịch vụ</th><th>Đơn giá</th><th>Trạng thái</th></tr></thead>
                <tbody>
                <tr th:each="dv : ${dichVuList}">
                    <td class="fw-semibold" th:text="${dv.tenDv}"></td>
                    <td th:text="${dv.donGia}"></td>
                    <td><span class="badge bg-success" th:text="${dv.trangThai}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(dichVuList)}"><td colspan="3" class="text-center text-muted py-4">Không có dữ liệu.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
