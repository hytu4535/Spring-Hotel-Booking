<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý dịch vụ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head>
<body><aside th:replace="~{staff/fragments :: sidebar}"></aside><main class="main-content">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Quản lý dịch vụ</h1><p class="text-muted mb-0">Tra cứu dịch vụ và đơn giá để phục vụ khách.</p></div><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'SERVICE_MANAGE_ADD')}" class="btn btn-primary" th:href="@{/admin/dich-vu/them}"><i class="fas fa-plus me-1"></i>Thêm dịch vụ</a></div>
<div class="card shadow-sm mb-4 border-0"><div class="card-body"><form method="get" class="row g-2"><div class="col-md-6"><input class="form-control" name="tenDv" th:value="${tenDv}" placeholder="Tìm theo tên dịch vụ..."></div><div class="col-md-2"><button class="btn btn-primary w-100"><i class="fas fa-search me-1"></i>Tra cứu</button></div><div class="col-md-2"><a class="btn btn-outline-secondary w-100" th:href="@{/staff/dich-vu}">Xóa lọc</a></div></form></div></div>
<div class="card shadow-sm border-0"><div class="card-header bg-white py-3 fw-bold text-secondary"><i class="fas fa-list me-2"></i>DANH SÁCH DỊCH VỤ</div><div class="table-responsive"><table class="table table-striped table-hover align-middle mb-0"><thead class="table-dark"><tr><th>Tên dịch vụ</th><th>Đơn giá</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody>
<tr th:each="dv : ${dichVuList}"><td class="fw-semibold" th:text="${dv.tenDv}"></td><td class="text-success fw-semibold" th:text="${dv.donGia}"></td><td><span class="badge bg-success" th:text="${dv.trangThai}"></span></td><td class="text-end"><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'SERVICE_MANAGE_EDIT')}" class="btn btn-sm btn-outline-primary" th:href="@{/admin/dich-vu/{id}/sua(id=${dv.maDv})}" title="Chỉnh sửa"><i class="fas fa-pen"></i></a><form th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'SERVICE_MANAGE_DELETE')}" class="d-inline" method="post" th:action="@{/admin/dich-vu/{id}/xoa(id=${dv.maDv})}"><button class="btn btn-sm btn-outline-danger ms-1" title="Xóa"><i class="fas fa-trash"></i></button></form></td></tr>
<tr th:if="${#lists.isEmpty(dichVuList)}"><td colspan="4" class="text-center text-muted py-4">Chưa có dữ liệu dịch vụ nào.</td></tr></tbody></table></div></div>
</main></body></html>
