<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quản lý loại phòng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head>
<body class="bg-light"><aside th:replace="~{staff/fragments :: sidebar}"></aside><main class="main-content">
<div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0 text-primary fw-bold"><i class="fas fa-layer-group me-2"></i>Quản lý loại phòng</h2><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_TYPE_MANAGE_ADD')}" class="btn btn-success fw-semibold" th:href="@{/admin/loai-phong(openCreate=true)}"><i class="fas fa-plus me-1"></i>Thêm loại phòng</a></div>
<div class="card shadow-sm mb-4 border-0"><div class="card-body"><form th:action="@{/staff/loai-phong}" method="get" class="row g-2 align-items-center"><div class="col-md-6"><input type="text" name="tenLoai" th:value="${tenLoai}" class="form-control" placeholder="Tìm theo tên loại phòng..."></div><div class="col-md-2"><button type="submit" class="btn btn-primary w-100"><i class="fas fa-search me-1"></i>Tra cứu</button></div><div class="col-md-2"><a th:href="@{/staff/loai-phong}" class="btn btn-outline-secondary w-100"><i class="fas fa-rotate-left me-1"></i>Xóa lọc</a></div></form></div></div>
<div class="card shadow-sm border-0"><div class="card-header bg-white py-3 fw-bold text-secondary"><i class="fas fa-list me-2"></i>DANH SÁCH LOẠI PHÒNG</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-striped table-hover align-middle mb-0"><thead class="table-dark"><tr><th class="text-center" style="width:80px">Mã</th><th>Tên loại phòng</th><th>Giá mặc định</th><th class="text-center">Sức chứa</th><th class="text-center">Diện tích</th><th class="text-center">Hình ảnh</th><th class="text-center">Thao tác</th></tr></thead><tbody>
<tr th:each="item : ${loaiPhongList}"><td class="text-center fw-bold" th:text="${item.maLoai != null ? item.maLoai : item.maLoai()}"></td><td><div class="fw-bold text-dark" th:text="${item.tenLoai != null ? item.tenLoai : item.tenLoai()}"></div><div class="text-muted small text-truncate" style="max-width:250px" th:text="${item.moTa != null ? item.moTa : item.moTa()}"></div></td><td class="fw-semibold text-success" th:text="${(item.giaMacDinh != null ? item.giaMacDinh : item.giaMacDinh()) != null ? #numbers.formatDecimal(item.giaMacDinh != null ? item.giaMacDinh : item.giaMacDinh(), 0, 'COMMA', 0, 'POINT') + ' VNĐ' : '0 VNĐ'}"></td><td class="text-center"><span class="badge bg-info text-dark" th:text="${(item.sucChua != null ? item.sucChua : item.sucChua()) + ' người'}"></span></td><td class="text-center" th:text="${(item.dienTich != null ? item.dienTich : item.dienTich()) != null ? (item.dienTich != null ? item.dienTich : item.dienTich()) + ' m²' : '-'}"></td><td class="text-center"><img th:if="${(item.hinhAnh != null ? item.hinhAnh : item.hinhAnh()) != null and !(item.hinhAnh != null ? item.hinhAnh : item.hinhAnh()).isBlank()}" th:src="${item.hinhAnh != null ? item.hinhAnh : item.hinhAnh()}" alt="Ảnh phòng" class="rounded border" style="width:50px;height:35px;object-fit:cover"><span th:unless="${(item.hinhAnh != null ? item.hinhAnh : item.hinhAnh()) != null and !(item.hinhAnh != null ? item.hinhAnh : item.hinhAnh()).isBlank()}" class="text-muted small">Chưa có</span></td><td class="text-center"><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_TYPE_MANAGE_EDIT')}" class="btn btn-sm btn-outline-primary" th:href="@{/admin/loai-phong(editId=${item.maLoai})}" title="Chỉnh sửa"><i class="fas fa-pen"></i></a><a th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_TYPE_MANAGE_DELETE')}" class="btn btn-sm btn-outline-danger ms-1" th:href="@{/admin/loai-phong(deleteId=${item.maLoai})}" title="Xóa"><i class="fas fa-trash"></i></a></td></tr>
<tr th:if="${#lists.isEmpty(loaiPhongList)}"><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-folder-open fa-2x mb-2 d-block"></i>Chưa có dữ liệu loại phòng nào.</td></tr></tbody></table></div></div></div>
</main></body></html>
