<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghi nhận thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body class="bg-light">
<th:block th:if="${isAdminView}"><aside th:replace="~{admin/fragments :: sidebar}"></aside></th:block>
<th:block th:unless="${isAdminView}"><aside th:replace="~{staff/fragments :: sidebar}"></aside></th:block>
<main class="main-content"><div class="card border-0 shadow-sm" style="max-width:700px;margin:auto;"><div class="card-body p-4">
    <h1 class="h3 mb-1">Ghi nhận thanh toán tại quầy</h1>
    <p class="text-muted">Booking: <strong th:text="${booking.maTraCuu}"></strong></p>
    <form method="post" th:action="${paymentBasePath + '/tao'}">
        <input type="hidden" name="maDp" th:value="${booking.maDp}">
        <div class="mb-3"><label class="form-label">Số tiền</label><input class="form-control" name="soTien" type="number" min="1" step="0.01" required></div>
        <div class="mb-3"><label class="form-label">Loại thanh toán</label><select class="form-select" name="loaiThanhToan"><option value="DAT_COC">Đặt cọc</option><option value="THANH_TOAN_DU">Thanh toán đủ</option><option value="HOAN_TIEN">Hoàn tiền</option></select></div>
        <div class="mb-3"><label class="form-label">Phương thức</label><select class="form-select" name="phuongThuc"><option value="TIEN_MAT">Tiền mặt</option><option value="CHUYEN_KHOAN">Chuyển khoản</option><option value="MOMO">MoMo</option></select></div>
        <div class="mb-3"><label class="form-label">Mã giao dịch</label><input class="form-control" name="maGiaoDich" placeholder="Tự sinh nếu để trống"></div>
        <div class="mb-4"><label class="form-label">Ghi chú</label><textarea class="form-control" name="ghiChu" rows="3"></textarea></div>
        <a class="btn btn-outline-secondary" th:href="${paymentBasePath}">Hủy</a><button class="btn btn-primary ms-2" type="submit">Lưu thanh toán</button>
    </form>
</div></div></main>
</body>
</html>
