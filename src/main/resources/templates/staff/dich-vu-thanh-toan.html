<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dịch vụ &amp; thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<aside th:replace="~{staff/fragments :: sidebar}"></aside>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Dịch vụ &amp; thanh toán</h1>
            <p class="text-muted mb-0">Ghi nhận dịch vụ phát sinh và thanh toán tại đơn đặt phòng.</p>
        </div>
        <i class="fas fa-cash-register fs-2 text-primary"></i>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="h5">Thực hiện tại quản lý đặt phòng</h2>
            <p class="text-muted">Chọn đơn đặt phòng để cập nhật dịch vụ sử dụng và thông tin thanh toán của khách.</p>
            <a class="btn btn-primary" th:href="@{/staff/don}">
                <i class="fas fa-clipboard-list me-1"></i> Mở quản lý đặt phòng
            </a>
        </div>
    </div>
</main>
</body>
</html>
