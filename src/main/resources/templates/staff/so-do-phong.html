<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sơ đồ phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:if="${isAdminView}" th:replace="~{admin/fragments :: sidebar}"></aside><aside th:unless="${isAdminView}" th:replace="~{staff/fragments :: sidebar}"></aside><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Nhận / trả phòng</h1><p class="text-muted">Theo dõi trạng thái phòng và thực hiện check-in, check-out.</p></div><a class="btn btn-outline-primary" th:href="@{/admin/dashboard}" th:if="${isAdminView}">Dashboard</a></div><div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div><div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div><div class="row g-3"><div class="col-md-6 col-xl-4" th:each="room : ${danhSachPhong}"><div class="card border-0 shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5" th:text="'Phòng ' + ${room.soPhong}"></h2><span class="badge bg-info text-dark" th:text="${room.trangThai}"></span></div><p class="text-muted mb-3" th:text="${room.tenKhachHang != null ? room.tenKhachHang : 'Chưa có khách'}"></p><form th:if="${room.maDpHienTai != null}" th:action="${roomBasePath}" method="post" class="d-flex gap-2"><input type="hidden" name="maDp" th:value="${room.maDpHienTai}"><button class="btn btn-sm btn-success" name="action" value="check_in">Check-in</button><button class="btn btn-sm btn-warning" name="action" value="check_out">Check-out</button></form></div></div></div></div></main></body></html>
