<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhận / trả phòng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}">
<style>.room-card{border-left:5px solid #0d6efd}.room-card.TRONG{border-left-color:#198754}.room-card.DA_DAT{border-left-color:#ffc107}.room-card.DANG_O{border-left-color:#dc3545}.room-card.BAO_TRI{border-left-color:#6c757d}</style></head>
<body><aside th:replace="~{staff/fragments :: sidebar}"></aside><main class="main-content">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Nhận / trả phòng</h1><p class="text-muted mb-0">Theo dõi tình trạng phòng và thực hiện check-in, check-out.</p></div><i class="fas fa-exchange-alt fs-2 text-primary"></i></div>
<div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div><div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div>
<div class="row g-3"><div class="col-md-6 col-xl-4" th:each="room : ${danhSachPhong}"><div class="card room-card h-100 shadow-sm" th:classappend="${room.trangThai}"><div class="card-body"><div class="d-flex justify-content-between align-items-start"><h2 class="h5 mb-0" th:text="'Phòng ' + ${room.soPhong}"></h2><span class="badge bg-info text-dark" th:text="${room.trangThai}"></span></div><p class="text-muted mt-3 mb-3" th:text="${room.tenKhachHang != null ? room.tenKhachHang : 'Chưa có khách'}"></p><form th:if="${room.maDpHienTai != null}" th:action="${roomBasePath}" method="post" class="d-flex gap-2"><input type="hidden" name="maDp" th:value="${room.maDpHienTai}"><button class="btn btn-sm btn-success" name="action" value="check_in"><i class="fas fa-sign-in-alt me-1"></i>Nhận phòng</button><button class="btn btn-sm btn-warning" name="action" value="check_out" onclick="return confirm('Xác nhận trả phòng?')"><i class="fas fa-sign-out-alt me-1"></i>Trả phòng</button></form><span th:unless="${room.maDpHienTai != null}" class="text-muted small">Không có đơn đang lưu trú</span></div></div></div><div class="col-12" th:if="${#lists.isEmpty(danhSachPhong)}"><div class="alert alert-light border text-center py-4">Chưa có dữ liệu phòng.</div></div></div>
</main></body></html>
