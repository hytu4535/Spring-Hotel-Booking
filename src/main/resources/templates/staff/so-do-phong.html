<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Phòng</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .main-content {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
            }
        }
        /* Style cho từng ô phòng */
        .room-box {
            border-radius: 10px;
            padding: 15px;
            min-height: 150px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .room-TRONG { background: linear-gradient(135deg, #198754, #20c997); }      /* Xanh lá */
        .room-DA_DAT { background: linear-gradient(135deg, #ffc107, #ffca2c); color: #000; }  /* Vàng */
        .room-DANG_O { background: linear-gradient(135deg, #dc3545, #f8d7da); color: #fff; }  /* Đỏ */
        .room-BAO_TRI { background: linear-gradient(135deg, #6c757d, #adb5bd); }     /* Xám */
        
        .room-number { font-size: 1.5rem; font-weight: bold; }
        .room-type { font-size: 0.9rem; opacity: 0.9; }
        .guest-name { font-weight: 600; margin-top: 10px; font-size: 0.95rem; }
    </style>
</head>
<body class="bg-light">

<!-- Thống nhất Sidebar theo chuẩn mới -->
<th:block th:if="${isAdminView}">
    <div th:replace="~{common/sidebar-admin :: sidebar}"></div>
</th:block>
<th:block th:unless="${isAdminView}">
    <div th:replace="~{common/sidebar-staff :: sidebar}"></div>
</th:block>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="mb-0 text-primary fw-bold">
            <i class="bi bi-grid-3x3-gap me-2"></i>Sơ Đồ Khách Sạn
        </h2>
        <div>
            <span class="badge bg-success me-1">Phòng Trống</span>
            <span class="badge bg-warning text-dark me-1">Đã Đặt (Chờ XN)</span>
            <span class="badge bg-danger me-1">Đang Ở</span>
            <span class="badge bg-secondary">Bảo Trì</span>
        </div>
    </div>

    <!-- Thông báo kết quả thao tác -->
    <th:block th:if="${successMsg}">
        <div class="alert alert-success alert-dismissible fade show fw-bold">
            <i class="bi bi-check-circle me-1"></i> [[${successMsg}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </th:block>
    <th:block th:if="${errorMsg}">
        <div class="alert alert-danger alert-dismissible fade show fw-bold">
            <i class="bi bi-exclamation-triangle me-1"></i> [[${errorMsg}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </th:block>

    <div class="row g-4">
        <th:block th:each="p : ${danhSachPhong}">
            <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
                <div class="room-box" th:classappend="'room-' + ${p.trangThai}">
                    <div>
                        <div class="d-flex justify-content-between align-items-start">
                            <span class="room-number">[[${p.soPhong}]]</span>
                            <span class="badge bg-light text-dark shadow-sm">Tầng [[${p.tang}]]</span>
                        </div>
                        <div class="room-type">[[${p.tenLoaiPhong}]]</div>
                    </div>

                    <!-- Hiển thị tên khách (nếu có) -->
                    <div th:if="${p.tenKhachHang != null}" class="guest-name">
                        <i class="bi bi-person-fill"></i> [[${p.tenKhachHang}]]
                    </div>
                    <div th:if="${p.tenKhachHang == null}" class="guest-name" style="opacity: 0.5;">
                        (Trống)
                    </div>

                    <!-- Nút thao tác Check-in / Check-out -->
                    <div class="mt-2 text-center" style="height: 32px;">
                        <th:block th:if="${p.trangThai == 'DA_DAT' && p.maDpHienTai != null}">
                            <form th:action="${roomBasePath}" method="post">
                                <input type="hidden" name="action" value="check_in">
                                <input type="hidden" name="maDp" th:value="${p.maDpHienTai}">
                                <button type="submit" class="btn btn-sm btn-dark w-100 fw-bold border-0">Nhận phòng</button>
                            </form>
                        </th:block>
                        
                        <th:block th:if="${p.trangThai == 'DANG_O' && p.maDpHienTai != null}">
                            <form th:action="${roomBasePath}" method="post">
                                <input type="hidden" name="action" value="check_out">
                                <input type="hidden" name="maDp" th:value="${p.maDpHienTai}">
                                <button type="submit" class="btn btn-sm btn-light w-100 fw-bold border-0 text-danger" onclick="return confirm('Xác nhận trả phòng?');">Trả phòng</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </th:block>
        
        <div class="col-12" th:if="${#lists.isEmpty(danhSachPhong)}">
            <div class="alert alert-light border text-center p-5 text-muted">
                <i class="bi bi-door-closed display-4 d-block mb-3"></i>
                Chưa có dữ liệu phòng.
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
