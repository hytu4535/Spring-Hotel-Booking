<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar">
    <div class="header">
        <h3><i class="fas fa-hotel"></i> HotelBooking</h3>
        <p class="mb-0 small">Khu vực nhân viên</p>
    </div>
    <div class="sidebar-menu">
        <div class="menu-group">
            <div class="menu-group-toggle">Tổng quan hệ thống</div>
            <div class="menu-group-items">
                <a th:href="@{/staff/dashboard}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'DASHBOARD')}"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a th:href="@{/staff/tai-khoan}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ACCOUNT_MANAGE')}"><i class="fas fa-user-cog me-2"></i>Tài khoản</a>
                <a th:href="@{/staff/vai-tro}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROLE_MANAGE')}"><i class="fas fa-shield-halved me-2"></i>Vai trò &amp; quyền</a>
                <a th:href="@{/staff/khach-hang}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'CUSTOMER_MANAGE')}"><i class="fas fa-users me-2"></i>Khách hàng</a>
            </div>
        </div>
        <div class="menu-group">
            <div class="menu-group-toggle">Vận hành khách sạn</div>
            <div class="menu-group-items">
                <a th:href="@{/staff/loai-phong}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_TYPE_MANAGE')}"><i class="fas fa-tags me-2"></i>Loại phòng</a>
                <a th:href="@{/staff/phong}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'ROOM_MANAGE')}"><i class="fas fa-bed me-2"></i>Phòng</a>
                <a th:href="@{/staff/dich-vu}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'SERVICE_MANAGE')}"><i class="fas fa-concierge-bell me-2"></i>Dịch vụ</a>
                <a th:href="@{/staff/don}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'BOOKING_MANAGE')}"><i class="fas fa-clipboard-list me-2"></i>Đặt phòng</a>
                <a th:href="@{/staff/nhan-tra-phong}" th:if="${@rolePermissionService.hasPermission(session.currentUser.vaiTro, 'CHECKIN_OUT')}"><i class="fas fa-exchange-alt me-2"></i>Nhận / trả phòng</a>
            </div>
        </div>
        <div class="menu-group">
            <div class="menu-group-toggle">Tài khoản cá nhân</div>
            <div class="menu-group-items">
                <a th:href="@{/staff/profile}"><i class="fas fa-id-card me-2"></i>Hồ sơ cá nhân</a>
                <a th:href="@{/staff/doi-mat-khau}"><i class="fas fa-key me-2"></i>Đổi mật khẩu</a>
            </div>
        </div>
    </div>
    <div class="sidebar-footer">
        <a th:href="@{/logout}" class="btn btn-danger btn-sm w-100"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
    </div>
</aside>
</body>
</html>
