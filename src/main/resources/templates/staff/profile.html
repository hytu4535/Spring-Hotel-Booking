<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ cá nhân</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:if="${session.currentUser.vaiTro == 'ADMIN'}" th:replace="~{admin/fragments :: sidebar}"></aside><aside th:unless="${session.currentUser.vaiTro == 'ADMIN'}" th:replace="~{staff/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-lg-8"><div class="mb-4"><h1 class="h2">Hồ sơ cá nhân</h1><p class="text-muted">Cập nhật thông tin tài khoản đang đăng nhập.</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên đăng nhập</label><input class="form-control" th:value="${user.tenDangNhap}" disabled></div><div class="col-md-6"><label class="form-label">Vai trò</label><input class="form-control" th:value="${user.vaiTro}" disabled></div><div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" name="hoTen" th:value="${user.hoTen}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" th:value="${user.email}" required></div><div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="soDienThoai" th:value="${user.soDienThoai}"></div></div><div class="mt-4"><button class="btn btn-primary" type="submit"><i class="fas fa-save me-1"></i>Lưu thay đổi</button></div></form></div></div></div></div></main></body></html>
