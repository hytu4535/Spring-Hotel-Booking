<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body class="bg-light">
<th:block th:if="${isAdminView}"><aside th:replace="~{admin/fragments :: sidebar}"></aside></th:block>
<th:block th:unless="${isAdminView}"><aside th:replace="~{staff/fragments :: sidebar}"></aside></th:block>
<main class="main-content">
    <div class="card border-0 shadow-sm" style="max-width:760px;margin:auto;">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Chi tiết thanh toán</h1>
                <a class="btn btn-outline-secondary" th:href="${paymentBasePath}">Quay lại</a>
            </div>
            <dl class="row mb-0">
                <dt class="col-sm-5">Mã booking</dt><dd class="col-sm-7" th:text="${payment.datPhong.maTraCuu}"></dd>
                <dt class="col-sm-5">Loại thanh toán</dt><dd class="col-sm-7" th:text="${payment.loaiThanhToan}"></dd>
                <dt class="col-sm-5">Phương thức</dt><dd class="col-sm-7" th:text="${payment.phuongThuc}"></dd>
                <dt class="col-sm-5">Số tiền</dt><dd class="col-sm-7 fw-bold text-success" th:text="${#numbers.formatDecimal(payment.soTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></dd>
                <dt class="col-sm-5">Mã giao dịch</dt><dd class="col-sm-7" th:text="${payment.maGiaoDich}"></dd>
                <dt class="col-sm-5">Nhân viên thu</dt><dd class="col-sm-7" th:text="${payment.maNvThu != null ? payment.maNvThu : 'Thanh toán online'}"></dd>
                <dt class="col-sm-5">Thời gian</dt><dd class="col-sm-7" th:text="${payment.ngayThanhToan}"></dd>
                <dt class="col-sm-5">Ghi chú</dt><dd class="col-sm-7" th:text="${payment.ghiChu}"></dd>
            </dl>
            <div class="mt-4" th:if="${payment.phuongThuc != 'VNPAY'}">
                <a class="btn btn-primary" th:href="${paymentBasePath + '/' + payment.maTt + '/sua'}">
                    <i class="bi bi-pencil me-1"></i>Sửa giao dịch tại quầy
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
