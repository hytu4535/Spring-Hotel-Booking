<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<aside th:replace="~{staff/fragments :: sidebar}"></aside>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Khách hàng</h1>
            <p class="text-muted mb-0">Tra cứu hồ sơ khách hàng và lịch sử đặt phòng.</p>
        </div>
        <i class="fas fa-users fs-2 text-primary"></i>
    </div>
    <form method="get" class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3"><label class="form-label">Họ tên</label><input class="form-control" name="hoTen" th:value="${hoTen}"></div>
                <div class="col-md-3"><label class="form-label">Email</label><input class="form-control" name="email" th:value="${email}"></div>
                <div class="col-md-2"><label class="form-label">Điện thoại</label><input class="form-control" name="soDienThoai" th:value="${soDienThoai}"></div>
                <div class="col-md-2"><label class="form-label">CCCD</label><input class="form-control" name="cccd" th:value="${cccd}"></div>
                <div class="col-md-2"><button class="btn btn-outline-primary w-100"><i class="fas fa-search me-1"></i> Tìm</button></div>
            </div>
        </div>
    </form>
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Khách hàng</th><th>Liên hệ</th><th>CCCD</th><th>Số đơn</th></tr></thead>
                <tbody>
                <tr th:each="kh : ${khachHangList}">
                    <td><strong th:text="${kh.hoTen}"></strong><small class="d-block text-muted" th:text="'Mã KH: ' + ${kh.maKh}"></small></td>
                    <td><span th:text="${kh.email}"></span><small class="d-block text-muted" th:text="${kh.soDienThoai}"></small></td>
                    <td th:text="${kh.cccd != null && !kh.cccd.isEmpty() ? kh.cccd : '-'}"></td>
                    <td th:text="${kh.soDonDatPhong}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(khachHangList)}"><td colspan="4" class="text-center text-muted py-4">Không tìm thấy khách hàng.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
