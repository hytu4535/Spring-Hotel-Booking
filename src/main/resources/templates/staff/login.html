<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hotel Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<section class="hero-banner" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center justify-content-lg-end">
            <div class="col-md-8 col-lg-5">
                <div class="soft-card p-4 p-lg-5">
                    <h3 class="mb-4 text-center">
                        <i class="bi bi-building me-1"></i>
                        <th:block th:if="${adminMode}">Đăng nhập nhân viên / quản trị</th:block>
                        <th:block th:unless="${adminMode}">Đăng nhập khách hàng</th:block>
                    </h3>

                    <th:block th:if="${error != null}">
                        <div class="alert alert-danger">[[${error}]]</div>
                    </th:block>
                    <th:block th:if="${param.oauthError}">
                        <div class="alert alert-warning"><span th:text="${param.oauthError}"></span></div>
                    </th:block>

                    <form method="post" th:action="${adminMode ? '/admin/login' : '/login'}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên đăng nhập</label>
                            <input type="text" name="tenDangNhap" class="form-control" th:value="${tenDangNhap}" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" name="matKhau" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-cta w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                        </button>
                    </form>

                    <th:block th:if="${!adminMode}">
                        <div class="text-center text-muted my-3">Hoặc đăng nhập với</div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-danger flex-fill" th:href="@{/login/google}">
                                <i class="bi bi-google"></i> Google
                            </a>
                            <a class="btn btn-outline-primary flex-fill" th:href="@{/login/facebook}">
                                <i class="bi bi-facebook"></i> Facebook
                            </a>
                        </div>
                    </th:block>

                    <div class="text-center mt-4">
                        <a href="/" class="text-dark">← Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
