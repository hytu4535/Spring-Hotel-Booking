<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="bi bi-building text-primary"></i>
                        <span th:text="${adminMode} ? 'Đăng nhập nhân viên / quản trị' : 'Đăng nhập khách hàng'">Đăng nhập</span>
                    </h3>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label" for="tenDangNhap">Tên đăng nhập</label>
                            <input id="tenDangNhap" type="text" name="tenDangNhap" class="form-control"
                                   th:value="${tenDangNhap}" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="matKhau">Mật khẩu</label>
                            <input id="matKhau" type="password" name="matKhau" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                        </button>
                    </form>
                    <div th:if="${!adminMode}">
                        <div class="text-center text-muted my-3">Hoặc đăng nhập với</div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-danger flex-fill" th:href="@{/login/google}">
                                <i class="bi bi-google"></i> Google
                            </a>
                            <a class="btn btn-outline-primary flex-fill" th:href="@{/login/facebook}">
                                <i class="bi bi-facebook"></i> Facebook
                            </a>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <a th:href="@{/}">← Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
