<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="bi bi-building"></i>
                        <th:block th:if="${adminMode}">Đăng nhập nhân viên / quản trị</th:block>
                        <th:block th:unless="${adminMode}">Đăng nhập khách hàng</th:block>
                    </h3>

                    <th:block th:if="${error}">
                        <div class="alert alert-danger">[[${error}]]</div>
                    </th:block>
                    <th:block th:if="${param.oauthError}">
                        <div class="alert alert-warning"><span th:text="${param.oauthError}"></span></div>
                    </th:block>

                    <form method="post" th:action="${adminMode ? '/admin/login' : '/login'}">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" name="tenDangNhap" class="form-control"
                                   th:value="${tenDangNhap}" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="matKhau" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                        </button>
                    </form>
                    <th:block th:if="${!adminMode}">
                        <div class="text-center text-muted my-3">Hoặc đăng nhập với</div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-danger flex-fill" th:href="@{/login/google}">
                                <i class="bi bi-google"></i> Google
                            </a>
                            <a class="btn btn-outline-primary flex-fill" th:href="@{/login/facebook}">
                                <i class="bi bi-facebook"></i> Facebook
                            </a>
                        </div>
                    </th:block>

                    <div class="text-center mt-3">
                        <a href="/">← Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
