<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ khách hàng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{common/header :: header}"></div>

<section class="page-hero">
    <div class="container">
        <h1>Hồ sơ khách hàng</h1>
        <p class="mb-0">Cập nhật thông tin liên hệ để việc xác nhận và hỗ trợ đặt phòng được nhanh chóng hơn.</p>
    </div>
</section>

<section class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="soft-card p-4 p-lg-5">
                <h3 class="mb-4">Thông tin cá nhân</h3>
                <th:block th:if="${success != null}"><div class="alert alert-success">[[${success}]]</div></th:block>
                <th:block th:if="${globalError != null}"><div class="alert alert-danger">[[${globalError}]]</div></th:block>
                <form method="post" th:object="${profile}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên</label>
                        <input th:field="*{hoTen}" class="form-control">
                        <div th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}" class="text-danger small"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input th:field="*{email}" type="email" class="form-control">
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input th:field="*{soDienThoai}" class="form-control">
                        <div th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}" class="text-danger small"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">CCCD</label>
                        <input th:field="*{cccd}" class="form-control">
                        <div th:if="${#fields.hasErrors('cccd')}" th:errors="*{cccd}" class="text-danger small"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ</label>
                        <textarea th:field="*{diaChi}" class="form-control" rows="3"></textarea>
                        <div th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}" class="text-danger small"></div>
                    </div>
                    <button class="btn btn-cta px-4" type="submit">Lưu thay đổi</button>
                </form>
            </div>
        </div></div>
</section>

<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
