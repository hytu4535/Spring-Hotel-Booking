<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{common/header :: header}"></div>
<div class="container my-4">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4">Hồ sơ khách hàng</h3>
                <th:block th:if="${success}"><div class="alert alert-success">[[${success}]]</div></th:block>
                <th:block th:if="${globalError}"><div class="alert alert-danger">[[${globalError}]]</div></th:block>
                <form method="post"  th:object="${profile}">
                    <div class="mb-3"><label class="form-label">Họ và tên</label><input th:field="*{hoTen}" class="form-control"><div th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}" class="text-danger small"></div></div>
                    <div class="mb-3"><label class="form-label">Email</label><input th:field="*{email}" type="email" class="form-control"><div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div></div>
                    <div class="mb-3"><label class="form-label">Số điện thoại</label><input th:field="*{soDienThoai}" class="form-control"><div th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}" class="text-danger small"></div></div>
                    <div class="mb-3"><label class="form-label">CCCD</label><input th:field="*{cccd}" class="form-control"><div th:if="${#fields.hasErrors('cccd')}" th:errors="*{cccd}" class="text-danger small"></div></div>
                    <div class="mb-3"><label class="form-label">Địa chỉ</label><textarea th:field="*{diaChi}" class="form-control" rows="3"></textarea><div th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}" class="text-danger small"></div></div>
                    <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
                </form>
            </div>
        </div>
    </div></div>
</div>
</body>
</html>
