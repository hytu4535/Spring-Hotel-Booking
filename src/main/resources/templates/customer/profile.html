<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ khách hàng - Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-building"></i> Hotel Booking</a><div><a class="btn btn-outline-light btn-sm me-2" th:href="@{/}">Trang chủ</a><a class="btn btn-warning btn-sm" th:href="@{/logout}">Đăng xuất</a></div></div></nav>
<main class="container py-5">
    <div class="row justify-content-center"><div class="col-lg-7">
        <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4"><i class="bi bi-person-circle text-primary me-2"></i>Hồ sơ khách hàng</h1>
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
            <div class="alert alert-danger" th:if="${globalError}" th:text="${globalError}"></div>
            <form th:action="@{/customer/profile}" th:object="${profile}" method="post">
                <div class="mb-3"><label class="form-label">Họ tên</label><input th:field="*{hoTen}" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Email</label><input th:field="*{email}" type="email" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Số điện thoại</label><input th:field="*{soDienThoai}" class="form-control"></div>
                <div class="mb-3"><label class="form-label">CCCD</label><input th:field="*{cccd}" class="form-control"></div>
                <div class="mb-4"><label class="form-label">Địa chỉ</label><input th:field="*{diaChi}" class="form-control"></div>
                <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>Lưu thay đổi</button>
                <a class="btn btn-outline-secondary ms-2" th:href="@{/}">Về trang chủ</a>
            </form>
        </div></div>
    </div></div>
</main>
</body>
</html>
