<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Hotel Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="hero-banner" style="min-height: 100vh;">
    <div class="container hero-content">
        <div class="row justify-content-center justify-content-lg-end">
            <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">
                <div class="soft-card p-4 p-lg-5">
                    <h1 class="h3 mb-4 text-center">Đăng ký tài khoản</h1>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold mb-1 d-block" for="tenDangNhap">Tên đăng nhập</label>
                                <input id="tenDangNhap" th:field="*{tenDangNhap}" class="form-control" required autofocus>
                                <div class="text-danger small" th:errors="*{tenDangNhap}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold mb-1 d-block" for="hoTen">Họ tên</label>
                                <input id="hoTen" th:field="*{hoTen}" class="form-control" required>
                                <div class="text-danger small" th:errors="*{hoTen}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold mb-1 d-block" for="email">Email</label>
                                <input id="email" th:field="*{email}" type="email" class="form-control" required>
                                <div class="text-danger small" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold mb-1 d-block" for="soDienThoai">Số điện thoại</label>
                                <input id="soDienThoai" th:field="*{soDienThoai}" class="form-control" required>
                                <div class="text-danger small" th:errors="*{soDienThoai}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold mb-1 d-block" for="matKhau">Mật khẩu</label>
                                <input id="matKhau" th:field="*{matKhau}" type="password" class="form-control" required>
                                <div class="text-danger small" th:errors="*{matKhau}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold mb-1 d-block" for="xacNhanMatKhau">Xác nhận mật khẩu</label>
                                <input id="xacNhanMatKhau" th:field="*{xacNhanMatKhau}" type="password" class="form-control" required>
                                <div class="text-danger small" th:errors="*{xacNhanMatKhau}"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-cta w-100 mt-4">
                            <i class="bi bi-person-plus me-1"></i> Đăng ký
                        </button>
                    </form>
                    <div class="text-center mt-4 auth-account-prompt">
                        Đã có tài khoản?
                        <a th:href="@{/login}" class="fw-semibold text-decoration-none">Đăng nhập</a>
                    </div>
                    <div class="text-center mt-2">
                        <a th:href="@{/}" class="text-dark">← Về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
