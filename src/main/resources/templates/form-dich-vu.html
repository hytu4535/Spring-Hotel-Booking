<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dịch vụ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-xl-8"><h1 class="h2 mb-4" th:text="${dichVu.maDv == null ? 'Thêm dịch vụ' : 'Cập nhật dịch vụ'}">Dịch vụ</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post" th:action="${formAction}" th:object="${dichVu}"><div class="mb-3"><label class="form-label">Tên dịch vụ</label><input class="form-control" th:field="*{tenDv}" required></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Đơn giá</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{donGia}" required></div><div class="col-md-6"><label class="form-label">Đơn vị tính</label><input class="form-control" th:field="*{donViTinh}" placeholder="Lần, suất, chai..."></div></div><div class="mb-3 mt-3"><label class="form-label">Mô tả</label><textarea class="form-control" rows="4" th:field="*{moTa}"></textarea></div><div class="mt-4"><a class="btn btn-outline-secondary" th:href="@{/admin/dich-vu}">Hủy</a><button class="btn btn-primary ms-2" type="submit"><i class="fas fa-save me-1"></i>Lưu dịch vụ</button></div></form></div></div></div></div></main></body></html>
