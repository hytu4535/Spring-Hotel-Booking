<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-xl-8"><h1 class="h2 mb-4">Thông tin phòng</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post" th:action="${formAction}" th:object="${phong}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Số phòng</label><input class="form-control" name="soPhong" th:field="*{soPhong}" required></div><div class="col-md-6"><label class="form-label">Loại phòng</label><select class="form-select" name="maLoai" required><option value="">Chọn loại phòng</option><option th:each="lp : ${loaiPhongList}" th:value="${lp.maLoai}" th:text="${lp.tenLoai}" th:selected="${phong.loaiPhong != null and phong.loaiPhong.maLoai == lp.maLoai}"></option></select></div><div class="col-md-6"><label class="form-label">Tầng</label><input class="form-control" name="tang" type="number" th:field="*{tang}"></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" name="trangThai" th:field="*{trangThai}"><option value="TRONG">Trống</option><option value="DA_DAT">Đã đặt</option><option value="DANG_O">Đang ở</option><option value="BAO_TRI">Bảo trì</option></select></div><div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control" name="ghiChu" th:field="*{ghiChu}" rows="3"></textarea></div></div><div class="mt-4"><a class="btn btn-outline-secondary" th:href="@{/admin/phong}">Hủy</a><button class="btn btn-primary ms-2" type="submit"><i class="fas fa-save me-1"></i>Lưu phòng</button></div></form></div></div></div></div></main></body></html>
