<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu quản trị</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-lg-6"><div class="mb-4"><h1 class="h2">Đổi mật khẩu</h1><p class="text-muted">Bảo vệ tài khoản quản trị bằng mật khẩu mới.</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/admin/doi-mat-khau}"><div class="mb-3"><label class="form-label">Mật khẩu hiện tại</label><input class="form-control" name="matKhauCu" type="password" required></div><div class="mb-3"><label class="form-label">Mật khẩu mới</label><input class="form-control" name="matKhauMoi" type="password" minlength="6" required></div><div class="mb-4"><label class="form-label">Xác nhận mật khẩu mới</label><input class="form-control" name="xacNhanMatKhauMoi" type="password" minlength="6" required></div><button class="btn btn-primary" type="submit"><i class="fas fa-key me-1"></i>Cập nhật mật khẩu</button></form></div></div></div></div></main></body></html>
