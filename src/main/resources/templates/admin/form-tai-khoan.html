<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sửa tài khoản</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-xl-8"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Sửa tài khoản</h1><p class="text-muted mb-0">Cập nhật thông tin tài khoản nhân viên.</p></div><a class="btn btn-outline-secondary" th:href="@{/admin/tai-khoan}">Quay lại</a></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post" th:action="@{/admin/tai-khoan/{id}/sua(id=${account.maTk})}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên đăng nhập</label><input class="form-control" th:value="${account.tenDangNhap}" disabled></div><div class="col-md-6"><label class="form-label">Vai trò</label><input class="form-control" th:value="${account.vaiTro}" disabled></div><div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" name="hoTen" th:value="${account.hoTen}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" th:value="${account.email}" required></div><div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="soDienThoai" th:value="${account.soDienThoai}"></div><div class="col-md-6"><label class="form-label">Mật khẩu mới</label><input class="form-control" name="matKhau" type="password" minlength="6" placeholder="Để trống nếu không đổi"></div></div><div class="mt-4"><button class="btn btn-primary" type="submit"><i class="fas fa-save me-1"></i>Lưu thay đổi</button></div></form></div></div></div></div></main></body></html>
