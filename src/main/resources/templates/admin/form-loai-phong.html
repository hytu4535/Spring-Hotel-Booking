<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loại phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-xl-8"><h1 class="h2 mb-4" th:text="${isEdit} ? 'Cập nhật loại phòng' : 'Thêm loại phòng'">Loại phòng</h1><div class="alert alert-danger" th:if="${globalError}" th:text="${globalError}"></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="${formAction}" th:object="${formData}" method="post"><div class="mb-3"><label class="form-label">Tên loại phòng</label><input class="form-control" th:field="*{tenLoai}" required></div><div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control" th:field="*{moTa}" rows="3"></textarea></div><div class="row g-3"><div class="col-md-4"><label class="form-label">Giá mặc định</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{giaMacDinh}" required></div><div class="col-md-4"><label class="form-label">Sức chứa</label><input class="form-control" type="number" min="1" th:field="*{sucChua}" required></div><div class="col-md-4"><label class="form-label">Diện tích (m²)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{dienTich}"></div></div><div class="mt-4"><a class="btn btn-outline-secondary" th:href="@{/admin/loai-phong}">Hủy</a><button class="btn btn-primary ms-2" type="submit"><i class="fas fa-save me-1"></i>Lưu loại phòng</button></div></form></div></div></div></div></main></body></html>
