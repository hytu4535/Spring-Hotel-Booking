<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý khách hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Quản lý khách hàng</h1><p class="text-muted mb-0">Quản lý hồ sơ, liên hệ và lịch sử đặt phòng.</p></div><a class="btn btn-primary" th:href="@{/admin/khach-hang/moi}"><i class="fas fa-user-plus me-1"></i>Thêm khách hàng</a></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" th:action="@{/admin/khach-hang}" class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label small">Họ tên</label><input class="form-control" name="hoTen" placeholder="Nhập họ tên" th:value="${hoTen}"></div><div class="col-md-3"><label class="form-label small">Email</label><input class="form-control" name="email" placeholder="Nhập email" th:value="${email}"></div><div class="col-md-2"><label class="form-label small">Điện thoại</label><input class="form-control" name="soDienThoai" placeholder="Số điện thoại" th:value="${soDienThoai}"></div><div class="col-md-2"><label class="form-label small">CCCD</label><input class="form-control" name="cccd" placeholder="Số CCCD" th:value="${cccd}"></div><div class="col-md-2 d-flex gap-2"><button class="btn btn-outline-primary flex-fill" type="submit" title="Tìm kiếm"><i class="fas fa-search"></i></button><a class="btn btn-outline-secondary" th:href="@{/admin/khach-hang}" title="Xóa bộ lọc"><i class="fas fa-rotate-left"></i></a></div></form></div></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Khách hàng</th><th>Liên hệ</th><th>CCCD</th><th>Địa chỉ</th><th>Đơn đặt phòng</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="kh : ${khachHangList}"><td><div class="fw-semibold" th:text="${kh.hoTen}"></div><small class="text-muted" th:text="'Mã KH: ' + ${kh.maKh}"></small></td><td><div th:text="${kh.email}"></div><small class="text-muted" th:text="${kh.soDienThoai}"></small></td><td th:text="${kh.cccd != null && !kh.cccd.isEmpty() ? kh.cccd : '-'}"></td><td th:text="${kh.diaChi != null && !kh.diaChi.isEmpty() ? kh.diaChi : '-'}"></td><td><span class="badge bg-light text-dark" th:text="${kh.soDonDatPhong}"></span></td><td class="text-end"><div class="btn-group" role="group"><a class="btn btn-sm btn-outline-info" th:href="@{/admin/khach-hang/{id}(id=${kh.maKh})}" title="Xem chi tiết"><i class="fas fa-eye"></i></a><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/khach-hang/{id}/sua(id=${kh.maKh})}" title="Chỉnh sửa"><i class="fas fa-pen"></i></a><form method="post" th:action="@{/admin/khach-hang/{id}/xoa(id=${kh.maKh})}" onsubmit="return confirm('Xóa hồ sơ khách hàng này?');"><button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa"><i class="fas fa-trash"></i></button></form></div></td></tr><tr th:if="${#lists.isEmpty(khachHangList)}"><td colspan="6" class="text-center text-muted py-5"><i class="fas fa-users-slash fa-2x mb-2 d-block"></i>Không tìm thấy khách hàng phù hợp.</td></tr></tbody></table></div></div></main></body></html>
