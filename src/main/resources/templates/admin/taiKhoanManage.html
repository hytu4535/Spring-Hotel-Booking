<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<th:block th:if="${staffView}"><aside th:replace="~{staff/fragments :: sidebar}"></aside></th:block>
<th:block th:unless="${staffView}"><aside th:replace="~{admin/fragments :: sidebar}"></aside></th:block>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Quản lý tài khoản</h1>
            <p class="text-muted mb-0">Quản lý tài khoản nhân viên, vai trò và trạng thái truy cập.</p>
        </div>
        <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#createAccountModal">
            <i class="fas fa-user-plus me-1"></i>Thêm tài khoản
        </button>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form method="get" th:action="${accountBasePath}" class="row g-3 align-items-end">
                <div class="col-lg-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input class="form-control" name="tenDangNhap" th:value="${filterTenDangNhap}"
                           placeholder="Nhập tên đăng nhập">
                </div>
                <div class="col-lg-3">
                    <label class="form-label">Họ tên</label>
                    <input class="form-control" name="hoTen" th:value="${filterHoTen}"
                           placeholder="Nhập họ tên">
                </div>
                <div class="col-lg-2">
                    <label class="form-label">Vai trò</label>
                    <select class="form-select" name="vaiTro">
                        <option value="">Tất cả</option>
                        <option value="ADMIN" th:selected="${filterVaiTro == 'ADMIN'}">Quản trị viên</option>
                        <option value="NHANVIEN" th:selected="${filterVaiTro == 'NHANVIEN'}">Nhân viên</option>
                        <option value="CUSTOMER" th:selected="${filterVaiTro == 'CUSTOMER'}">Khách hàng</option>
                    </select>
                </div>
                <div class="col-lg-2">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" name="trangThai">
                        <option value="">Tất cả</option>
                        <option value="1" th:selected="${filterTrangThai == 1}">Hoạt động</option>
                        <option value="0" th:selected="${filterTrangThai == 0}">Đã khóa</option>
                    </select>
                </div>
                <div class="col-lg-2">
                    <label class="form-label">Xóa mềm</label>
                    <select class="form-select" name="xoaFilter">
                        <option value="active" th:selected="${filterXoa == 'active'}">Đang hiển thị</option>
                        <option value="deleted" th:selected="${filterXoa == 'deleted'}">Đã xóa mềm</option>
                        <option value="all" th:selected="${filterXoa == 'all'}">Tất cả</option>
                    </select>
                </div>
                <div class="col-lg-2">
                    <label class="form-label">Sắp xếp</label>
                    <select class="form-select" name="sort">
                        <option value="date-desc" th:selected="${filterSort == 'date-desc'}">Mới nhất</option>
                        <option value="date-asc" th:selected="${filterSort == 'date-asc'}">Cũ nhất</option>
                        <option value="name" th:selected="${filterSort == 'name'}">Theo họ tên</option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="fas fa-search me-1"></i>Lọc dữ liệu
                    </button>
                    <a class="btn btn-outline-secondary" th:href="${accountBasePath}">Xóa bộ lọc</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Tài khoản</th><th>Họ tên</th><th>Email</th><th>Vai trò</th>
                    <th>Trạng thái</th><th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tk : ${taiKhoanList}">
                    <td class="fw-semibold" th:text="${tk.tenDangNhap}"></td>
                    <td th:text="${tk.hoTen}"></td>
                    <td th:text="${tk.email}"></td>
                    <td><span class="badge bg-primary" th:text="${tk.vaiTro}"></span></td>
                    <td>
                        <span class="badge"
                              th:classappend="${tk.daXoa ? 'bg-danger' : (tk.trangThai == 1 ? 'bg-success' : 'bg-secondary')}"
                              th:text="${tk.daXoa ? 'Đã xóa mềm' : (tk.trangThai == 1 ? 'Hoạt động' : 'Đã khóa')}"></span>
                    </td>
                    <td class="text-end">
                        <a th:if="${!tk.daXoa}" class="btn btn-sm btn-outline-primary"
                           th:href="${accountBasePath + '/' + tk.maTk + '/sua'}" title="Sửa tài khoản">
                            <i class="fas fa-pen"></i>
                        </a>
                        <form th:if="${!tk.daXoa}" class="d-inline" method="post" th:action="${accountBasePath}">
                            <input type="hidden" name="maTk" th:value="${tk.maTk}">
                            <button class="btn btn-sm btn-outline-warning" name="action" value="role"
                                    title="Đổi vai trò"><i class="fas fa-user-shield"></i></button>
                            <button class="btn btn-sm"
                                    th:classappend="${tk.trangThai == 1 ? 'btn-outline-danger' : 'btn-outline-success'}"
                                    name="action" th:value="${tk.trangThai == 1 ? 'lock' : 'unlock'}">
                                <i class="fas" th:classappend="${tk.trangThai == 1 ? 'fa-lock' : 'fa-unlock'}"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" name="action" value="delete"
                                    title="Xóa mềm"
                                    th:disabled="${tk.maTk == session.currentUser.maTk}"
                                    onclick="return confirm('Bạn có chắc muốn xóa mềm tài khoản này?');">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(taiKhoanList)}">
                    <td colspan="6" class="text-center text-muted py-4">Không có tài khoản phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="createAccountModal" tabindex="-1"
     th:classappend="${openCreateModal} ? 'show' : ''"
     th:style="${openCreateModal} ? 'display:block' : ''">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="post" th:action="${accountBasePath + '/tao'}" th:object="${accountForm}">
                <div class="modal-header">
                    <h2 class="modal-title h5"><i class="fas fa-user-plus me-2"></i>Thêm tài khoản</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên đăng nhập</label>
                            <input class="form-control" th:field="*{tenDangNhap}"
                                   th:classappend="${#fields.hasErrors('tenDangNhap')} ? ' is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tenDangNhap')}"
                                 th:errors="*{tenDangNhap}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mật khẩu</label>
                            <input class="form-control" th:field="*{matKhau}" type="password"
                                   th:classappend="${#fields.hasErrors('matKhau')} ? ' is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matKhau')}"
                                 th:errors="*{matKhau}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input class="form-control" th:field="*{xacNhanMatKhau}" type="password"
                                   th:classappend="${#fields.hasErrors('xacNhanMatKhau')} ? ' is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('xacNhanMatKhau')}"
                                 th:errors="*{xacNhanMatKhau}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Họ tên</label>
                            <input class="form-control" th:field="*{hoTen}"
                                   th:classappend="${#fields.hasErrors('hoTen')} ? ' is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('hoTen')}"
                                 th:errors="*{hoTen}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input class="form-control" th:field="*{soDienThoai}"
                                   th:classappend="${#fields.hasErrors('soDienThoai')} ? ' is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('soDienThoai')}"
                                 th:errors="*{soDienThoai}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Vai trò</label>
                            <select class="form-select" th:field="*{vaiTro}"
                                    th:classappend="${#fields.hasErrors('vaiTro')} ? ' is-invalid'">
                                <option value="">-- Chọn vai trò --</option>
                                <option value="ADMIN">Quản trị viên</option>
                                <option value="NHANVIEN">Nhân viên</option>
                                <option value="CUSTOMER">Khách hàng</option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('vaiTro')}"
                                 th:errors="*{vaiTro}"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <a class="btn btn-outline-secondary" th:href="${accountBasePath}">Hủy</a>
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save me-1"></i>Tạo tài khoản</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:if="${openCreateModal}" class="modal-backdrop fade show"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${openCreateModal}">
    new bootstrap.Modal(document.getElementById('createAccountModal')).show();
</script>
</body>
</html>
