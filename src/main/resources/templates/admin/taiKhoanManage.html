<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý tài khoản</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Quản lý tài khoản</h1><p class="text-muted mb-0">Quản lý tài khoản nhân viên, vai trò và trạng thái truy cập.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createAccountModal"><i class="fas fa-user-plus me-1"></i>Thêm nhân viên</button></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" class="row g-2"><div class="col-md-4"><label class="form-label">Tên đăng nhập</label><input class="form-control" name="tenDangNhap" placeholder="Tìm theo username" th:value="${filterTenDangNhap}"></div><div class="col-md-4"><label class="form-label">Họ tên</label><input class="form-control" name="hoTen" placeholder="Tìm theo họ tên" th:value="${filterHoTen}"></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-primary w-100"><i class="fas fa-search me-1"></i>Tìm</button></div><div class="col-md-2 d-flex align-items-end"><a class="btn btn-outline-secondary w-100" th:href="@{/admin/tai-khoan}">Xóa lọc</a></div></form></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="tk : ${taiKhoanList}"><td class="fw-semibold" th:text="${tk.tenDangNhap}"></td><td th:text="${tk.hoTen}"></td><td th:text="${tk.email}"></td><td><span class="badge bg-primary" th:text="${tk.vaiTro}"></span></td><td><span class="badge" th:classappend="${tk.trangThai == 1 ? 'bg-success' : 'bg-secondary'}" th:text="${tk.trangThai == 1 ? 'Hoạt động' : 'Đã khóa'}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" title="Sửa tài khoản" th:href="@{/admin/tai-khoan/{id}/sua(id=${tk.maTk})}"><i class="fas fa-pen"></i></a><form class="d-inline" method="post"><input type="hidden" name="maTk" th:value="${tk.maTk}"><button class="btn btn-sm btn-outline-warning" name="action" value="role" title="Đổi vai trò"><i class="fas fa-user-shield"></i></button><button class="btn btn-sm" th:classappend="${tk.trangThai == 1 ? 'btn-outline-danger' : 'btn-outline-success'}" name="action" th:value="${tk.trangThai == 1 ? 'lock' : 'unlock'}" th:title="${tk.trangThai == 1 ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}"><i class="fas" th:classappend="${tk.trangThai == 1 ? 'fa-lock' : 'fa-unlock'}"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(taiKhoanList)}"><td colspan="6" class="text-center text-muted py-4">Không có tài khoản phù hợp.</td></tr></tbody></table></div></div></main><div class="modal fade" id="createAccountModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><form method="post"><div class="modal-header"><h2 class="modal-title h5"><i class="fas fa-user-plus me-2"></i>Thêm tài khoản nhân viên</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" name="action" value="create"><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên đăng nhập</label><input class="form-control" name="tenDangNhap" required></div><div class="col-md-6"><label class="form-label">Mật khẩu</label><input class="form-control" name="matKhau" type="password" minlength="6" required></div><div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" name="hoTen" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="soDienThoai"></div><div class="col-md-6"><label class="form-label">Vai trò mặc định</label><input class="form-control" value="NHANVIEN" disabled></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit"><i class="fas fa-save me-1"></i>Tạo tài khoản</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
