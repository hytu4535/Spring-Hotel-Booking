<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đặt phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Quản lý đặt phòng</h1><p class="text-muted">Quản lý trạng thái các đơn đặt phòng của khách hàng.</p></div><a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">Dashboard</a></div><div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div><div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Mã tra cứu</th><th>Khách hàng</th><th>Ngày nhận</th><th>Ngày trả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="don : ${danhSachDon}"><td class="fw-semibold" th:text="${don.maTraCuu}"></td><td th:text="${don.khachHang != null ? don.khachHang.hoTen : '-'}"></td><td th:text="${don.ngayNhanPhong}"></td><td th:text="${don.ngayTraPhong}"></td><td><span class="badge bg-info text-dark" th:text="${don.trangThai}"></span></td><td><form method="post" th:action="@{/admin/dat-phong}" class="d-flex gap-2"><input type="hidden" name="maDp" th:value="${don.maDp}"><input type="hidden" name="action" value="update"><select class="form-select form-select-sm" name="trangThaiMoi"><option value="DA_XAC_NHAN">Xác nhận</option><option value="DA_NHAN_PHONG">Đã nhận phòng</option><option value="DA_TRA_PHONG">Đã trả phòng</option><option value="DA_HUY">Hủy đơn</option></select><button class="btn btn-sm btn-primary" title="Cập nhật"><i class="fas fa-save"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(danhSachDon)}"><td colspan="6" class="text-center text-muted py-4">Chưa có đơn đặt phòng.</td></tr></tbody></table></div></div></main></body></html>
