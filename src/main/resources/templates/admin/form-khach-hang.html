<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${formTitle}">Khách hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="row justify-content-center"><div class="col-xl-8"><h1 class="h2 mb-4" th:text="${formTitle}">Khách hàng</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="${formAction}" th:object="${customerForm}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" th:field="*{hoTen}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}" required></div><div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" th:field="*{soDienThoai}"></div><div class="col-md-6"><label class="form-label">CCCD</label><input class="form-control" th:field="*{cccd}"></div><div class="col-12"><label class="form-label">Địa chỉ</label><textarea class="form-control" rows="3" th:field="*{diaChi}"></textarea></div></div><div class="mt-4"><a class="btn btn-outline-secondary" th:href="@{/admin/khach-hang}">Hủy</a><button class="btn btn-primary ms-2" type="submit"><i class="fas fa-save me-1"></i>Lưu khách hàng</button></div></form></div></div></div></div></main></body></html>
