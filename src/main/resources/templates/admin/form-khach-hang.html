<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle}">Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<aside th:replace="~{admin/fragments :: sidebar}"></aside>
<main class="main-content">
    <div class="row justify-content-center">
        <div class="col-xl-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 mb-1" th:text="${formTitle}">Khách hàng</h1>
                    <p class="text-muted mb-0">Nhập đầy đủ thông tin liên hệ để quản lý hồ sơ chính xác.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/admin/khach-hang}">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                </a>
            </div>
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white py-3">
                    <i class="fas fa-user-pen me-2"></i>Thông tin hồ sơ
                </div>
                <div class="card-body p-4">
                    <form th:action="${formAction}" th:object="${customerForm}" method="post" novalidate>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"
                             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Tên tài khoản <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{maTk}"
                                        th:disabled="${formTitle == 'Cập nhật khách hàng'}"
                                        th:classappend="${#fields.hasErrors('maTk')} ? ' is-invalid'">
                                    <option value="">-- Chọn tài khoản khách hàng --</option>
                                    <option th:each="account : ${customerAccounts}"
                                            th:value="${account.maTk}"
                                            th:text="${account.tenDangNhap + ' - ' + account.hoTen + ' (' + account.email + ')'}"
                                            th:attr="data-ho-ten=${account.hoTen},data-email=${account.email},data-so-dien-thoai=${account.soDienThoai}"></option>
                                </select>
                                <input type="hidden" th:if="${formTitle == 'Cập nhật khách hàng'}" th:field="*{maTk}">
                                <div class="form-text">Thông tin họ tên, email và số điện thoại được lấy từ tài khoản.</div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('maTk')}"
                                     th:errors="*{maTk}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Họ tên</label>
                                <input id="accountHoTen" class="form-control" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Email</label>
                                <input id="accountEmail" class="form-control" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Số điện thoại</label>
                                <input id="accountSoDienThoai" class="form-control" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">CCCD</label>
                                <input class="form-control" th:field="*{cccd}"
                                       th:classappend="${#fields.hasErrors('cccd')} ? ' is-invalid'">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cccd')}"
                                     th:errors="*{cccd}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Địa chỉ</label>
                                <textarea class="form-control" rows="3" th:field="*{diaChi}"
                                          th:classappend="${#fields.hasErrors('diaChi')} ? ' is-invalid'"></textarea>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('diaChi')}"
                                     th:errors="*{diaChi}"></div>
                            </div>
                        </div>
                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/admin/khach-hang}">Hủy</a>
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-save me-1"></i>Lưu khách hàng
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
    const accountSelect = document.getElementById('maTk');
    const accountHoTen = document.getElementById('accountHoTen');
    const accountEmail = document.getElementById('accountEmail');
    const accountSoDienThoai = document.getElementById('accountSoDienThoai');

    function showAccountInfo() {
        const option = accountSelect.options[accountSelect.selectedIndex];
        accountHoTen.value = option && option.dataset.hoTen ? option.dataset.hoTen : '';
        accountEmail.value = option && option.dataset.email ? option.dataset.email : '';
        accountSoDienThoai.value = option && option.dataset.soDienThoai ? option.dataset.soDienThoai : '';
    }

    accountSelect.addEventListener('change', showAccountInfo);
    showAccountInfo();
</script>
</body>
</html>
