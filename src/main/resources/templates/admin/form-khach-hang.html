<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi"><head><meta charset="UTF-8"><title>[[${formTitle}]]</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
<style>
    :root { --sidebar-width: 250px; }
    body { background-color: #f8f9fa; overflow-x: hidden; }
    .main-content {
        margin-left: var(--sidebar-width);
        padding: 20px;
        min-height: 100vh;
        width: calc(100% - var(--sidebar-width));
        box-sizing: border-box;
    }
    @media (max-width: 768px) {
        .main-content { margin-left: 0; width: 100%; }
    }
</style></head>
<body>
<div th:replace="~{common/sidebar-admin :: sidebar}"></div>
<main class="main-content">
    <a th:href="@{/admin/khach-hang}" class="btn btn-link px-0">← Danh sách khách hàng</a>
    <div class="card shadow-sm"><div class="card-body">
        <h3 class="mb-4">[[${formTitle}]]</h3>
        <th:block th:if="${error}"><div class="alert alert-danger">[[${error}]]</div></th:block>
        <form method="post" th:action="${formAction}"  th:object="${customerForm}">
            <div class="row g-3">
                <div class="col-md-6"><label th:for="hoTen" class="form-label">Họ tên *</label><input th:field="*{hoTen}" class="form-control"><div th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}" class="text-danger small"></div></div>
                <div class="col-md-6"><label th:for="email" class="form-label">Email *</label><input th:field="*{email}" type="email" class="form-control"><div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div></div>
                <div class="col-md-6"><label th:for="soDienThoai" class="form-label">Số điện thoại</label><input th:field="*{soDienThoai}" class="form-control"><div th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}" class="text-danger small"></div></div>
                <div class="col-md-6"><label th:for="cccd" class="form-label">CCCD</label><input th:field="*{cccd}" class="form-control"><div th:if="${#fields.hasErrors('cccd')}" th:errors="*{cccd}" class="text-danger small"></div></div>
                <div class="col-12"><label th:for="diaChi" class="form-label">Địa chỉ</label><input th:field="*{diaChi}" class="form-control"><div th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}" class="text-danger small"></div></div>
            </div>
            <div class="mt-4"><button class="btn btn-success"><i class="fas fa-plus"></i> [[${formTitle == 'Thêm khách hàng' ? 'Thêm khách hàng' : 'Lưu thay đổi'}]]</button><a th:href="@{/admin/khach-hang}" class="btn btn-outline-secondary ms-2">Hủy</a></div>
        </form>
    </div></div>
</main></body></html>
