<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý vai trò</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>
<th:block th:if="${staffView}"><aside th:replace="~{staff/fragments :: sidebar}"></aside></th:block>
<th:block th:unless="${staffView}"><aside th:replace="~{admin/fragments :: sidebar}"></aside></th:block>
<main class="main-content">
    <div class="mb-4"><h1 class="h2 mb-1">Quản lý vai trò</h1><p class="text-muted mb-0">Thiết lập quyền linh động theo từng chức năng nghiệp vụ.</p></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3"><strong><i class="fas fa-users-gear me-2 text-primary"></i>Vai trò hệ thống</strong></div>
                <div class="list-group list-group-flush">
                    <a th:each="role : ${roles}" th:href="@{${roleBasePath}(roleId=${role.id})}" class="list-group-item list-group-item-action" th:classappend="${role.id == selectedRole.id ? ' active' : ''}">
                        <div class="d-flex justify-content-between"><span><i class="fas fa-user-tag me-2"></i><span th:text="${role.displayName}"></span></span><span class="badge" th:classappend="${role.active ? ' bg-success' : ' bg-secondary'}" th:text="${role.active ? 'Đang bật' : 'Đã khóa'}"></span></div>
                        <small th:text="${role.code}"></small>
                    </a>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3"><strong><i class="fas fa-sliders me-2 text-primary"></i><span th:text="${selectedRole.displayName}"></span></strong></div>
                <div class="card-body" th:if="${selectedRole.code == 'CUSTOMER'}">
                    <p class="text-muted mb-0">Vai trò khách hàng không được gán quyền quản trị.</p>
                </div>
                <div class="card-body" th:unless="${selectedRole.code == 'CUSTOMER'}">
                    <form method="post" th:action="${roleAction}">
                        <div class="mb-3"><label class="form-label fw-semibold">Mô tả vai trò</label><textarea class="form-control" name="description" rows="2" th:text="${selectedRole.description}"></textarea></div>
                        <div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${selectedRole.active}" th:disabled="${selectedRole.code == 'ADMIN'}"><label class="form-check-label">Cho phép sử dụng vai trò này</label></div>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle text-center">
                                <thead class="table-dark"><tr><th class="text-start">Tên quyền</th><th>Xem</th><th>Thêm</th><th>Sửa</th><th>Xóa</th></tr></thead>
                                <tbody>
                                <tr th:each="feature : ${permissionFeatures}">
                                    <th class="text-start" th:text="${feature.value}"></th>
                                    <td th:each="action : ${ {'VIEW','ADD','EDIT','DELETE'} }">
                                        <input class="form-check-input" type="checkbox" name="permissions" th:value="${feature.key + '_' + action}" th:checked="${assignedCodes.contains(feature.key + '_' + action)}" th:disabled="${selectedRole.code == 'ADMIN'}">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-end mt-3"><button class="btn btn-primary" type="submit" th:disabled="${selectedRole.code == 'ADMIN'}"><i class="fas fa-save me-1"></i>Lưu cấu hình</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
