<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${phongId != null ? 'Cập nhật phòng - HotelBooking' : 'Thêm mới phòng - HotelBooking'}">Thêm phòng mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <style>
        .main-content {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{common/sidebar-admin :: sidebar}"></div>

<div class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1" th:text="${phongId != null ? 'Cập nhật thông tin phòng' : 'Thêm phòng mới'}">Thêm phòng mới</h3>
            <p class="text-muted small mb-0">Nhập đầy đủ thông tin bên dưới để lưu dữ liệu phòng</p>
        </div>
        <a th:href="@{/admin/phong}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>

    <!-- Thông báo lỗi ngoại lệ nếu có -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <form th:action="${phongId != null ? '/admin/phong/edit/' + phongId : '/admin/phong/create'}"
                  th:object="${phongForm}" method="post" class="row g-3">

                <!-- Số phòng -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Số phòng <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{soPhong}" class="form-control"
                           th:classappend="${#fields.hasErrors('soPhong')} ? 'is-invalid' : ''" placeholder="Ví dụ: 101, P202">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('soPhong')}" th:errors="*{soPhong}">Số phòng không hợp lệ</div>
                </div>

                <!-- Mã loại phòng -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Mã loại phòng <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{maLoaiPhong}" class="form-control"
                           th:classappend="${#fields.hasErrors('maLoaiPhong')} ? 'is-invalid' : ''" placeholder="Nhập mã loại phòng">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('maLoaiPhong')}" th:errors="*{maLoaiPhong}">Vui lòng nhập mã loại phòng</div>
                </div>

                <!-- Tầng -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tầng</label>
                    <input type="number" th:field="*{tang}" class="form-control" min="1" placeholder="Ví dụ: 1">
                </div>

                <!-- Trạng thái phòng -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Trạng thái phòng</label>
                    <select class="form-select" th:field="*{trangThaiPhong}">
                        <option th:value="${T(com.hotel.enums.TrangThaiPhong).TRONG}">Trống</option>
                        <option th:value="${T(com.hotel.enums.TrangThaiPhong).DA_DAT}">Đã đặt</option>
                        <option th:value="${T(com.hotel.enums.TrangThaiPhong).DANG_O}">Đang ở</option>
                        <option th:value="${T(com.hotel.enums.TrangThaiPhong).BAO_TRI}">Bảo trì</option>
                    </select>
                </div>

                <!-- Ghi chú -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Ghi chú</label>
                    <textarea class="form-control" th:field="*{ghiChu}" rows="3" placeholder="Nhập ghi chú chi tiết về phòng..."></textarea>
                </div>

                <div class="col-12 mt-4 text-end">
                    <a th:href="@{/admin/phong}" class="btn btn-light border me-2">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary fw-semibold">
                        <i class="fas fa-save me-1"></i> Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
