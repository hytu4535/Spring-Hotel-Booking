<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phòng</title>
    <!-- Bootstrap 5 CSS & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Bổ sung File CSS của Admin Sidebar -->
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">

    <style>
        /* Đẩy nội dung trang sang bên phải 250px để nhường chỗ cho Sidebar */
        .main-content {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body class="bg-light">

<!-- Nhúng Sidebar Admin -->
<div th:replace="~{common/sidebar-admin :: sidebar}"></div>

<!-- Bọc toàn bộ nội dung trang trong div.main-content -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 text-primary fw-bold">
            <i class="fas fa-door-open me-2"></i>Quản Lý Phòng
        </h2>
    </div>

    <!-- Thông báo Success / Error từ RedirectAttributes -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}">Có lỗi xảy ra!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Card Thanh Công Cụ & Thêm Mới (Đồng bộ chuẩn giao diện Loại phòng) -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body">
            <div class="row g-2 align-items-center justify-content-between">
                <div class="col-md-6">
                    <form th:action="@{/admin/phong}" method="get" class="d-flex gap-2">
                        <input type="text" name="soPhong" th:value="${param.soPhong}" class="form-control" placeholder="Tìm theo số phòng...">
                        <button type="submit" class="btn btn-primary text-nowrap">
                            <i class="fas fa-search me-1"></i> Tra cứu
                        </button>
                        <a th:href="@{/admin/phong}" class="btn btn-outline-secondary text-nowrap">
                            <i class="fas fa-rotate-left me-1"></i> Xóa lọc
                        </a>
                    </form>
                </div>
                <div class="col-md-auto text-end">
                    <!-- Nút Thêm mới: Mở Modal Pop-up -->
                    <button type="button" class="btn btn-success fw-semibold" onclick="openCreateModal()">
                        <i class="fas fa-plus me-1"></i> Thêm phòng mới
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Card Bảng Danh Sách (Giao diện giống hệt Loại phòng) -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 fw-bold text-secondary">
            <i class="fas fa-list me-2"></i>DANH SÁCH PHÒNG
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="text-center" style="width: 80px;">STT</th>
                        <th>Số phòng</th>
                        <th>Loại phòng</th>
                        <th class="text-center">Tầng</th>
                        <th class="text-center">Trạng thái</th>
                        <th>Ghi chú</th>
                        <th class="text-center" style="width: 130px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Vòng lặp danh sách phòng -->
                    <tr th:each="item, iterStat : ${dsPhong}">
                        <td class="text-center fw-bold" th:text="${iterStat.count}">1</td>
                        <td class="fw-bold text-dark" th:text="${item.soPhong != null ? item.soPhong : item.soPhong()}">101</td>
                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${(item.maLoaiPhong != null ? item.maLoaiPhong : item.maLoaiPhong()) != null ? 'Mã loại: ' + (item.maLoaiPhong != null ? item.maLoaiPhong : item.maLoaiPhong()) : 'Chưa xếp'}">
                                Loại 1
                            </span>
                        </td>
                        <td class="text-center" th:text="${(item.tang != null ? item.tang : item.tang()) != null ? 'Tầng ' + (item.tang != null ? item.tang : item.tang()) : '-'}">Tầng 1</td>
                        <td class="text-center">
                            <span th:if="${(item.trangThaiPhong != null ? item.trangThaiPhong : item.trangThaiPhong()) != null and (item.trangThaiPhong != null ? item.trangThaiPhong.name() : item.trangThaiPhong().name()) == 'TRONG'}" class="badge bg-success">Trống</span>
                            <span th:if="${(item.trangThaiPhong != null ? item.trangThaiPhong : item.trangThaiPhong()) != null and (item.trangThaiPhong != null ? item.trangThaiPhong.name() : item.trangThaiPhong().name()) == 'DA_DAT'}" class="badge bg-warning text-dark">Đã đặt</span>
                            <span th:if="${(item.trangThaiPhong != null ? item.trangThaiPhong : item.trangThaiPhong()) != null and (item.trangThaiPhong != null ? item.trangThaiPhong.name() : item.trangThaiPhong().name()) == 'DANG_O'}" class="badge bg-danger">Đang ở</span>
                            <span th:if="${(item.trangThaiPhong != null ? item.trangThaiPhong : item.trangThaiPhong()) != null and (item.trangThaiPhong != null ? item.trangThaiPhong.name() : item.trangThaiPhong().name()) == 'BAO_TRI'}" class="badge bg-secondary">Bảo trì</span>
                        </td>
                        <td class="text-muted small text-truncate" style="max-width: 250px;" th:text="${item.ghiChu != null ? item.ghiChu : item.ghiChu()}">Ghi chú...</td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <!-- Nút Sửa Pop-up -->
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:data-id="${item.maPhong != null ? item.maPhong : item.maPhong()}"
                                        th:data-so-phong="${item.soPhong != null ? item.soPhong : item.soPhong()}"
                                        th:data-ma-loai="${item.maLoaiPhong != null ? item.maLoaiPhong : item.maLoaiPhong()}"
                                        th:data-tang="${item.tang != null ? item.tang : item.tang()}"
                                        th:data-trang-thai="${(item.trangThaiPhong != null ? item.trangThaiPhong : item.trangThaiPhong()) != null ? (item.trangThaiPhong != null ? item.trangThaiPhong.name() : item.trangThaiPhong().name()) : 'TRONG'}"
                                        th:data-ghi-chu="${item.ghiChu != null ? item.ghiChu : item.ghiChu()}"
                                        onclick="openEditModalFromBtn(this)"
                                        title="Chỉnh sửa">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <!-- Form Xóa -->
                                <form th:action="@{/admin/phong/delete/{id}(id=${item.maPhong != null ? item.maPhong : item.maPhong()})}"
                                      method="post"
                                      th:onsubmit="return confirm('Bạn có chắc chắn muốn xóa phòng [[${item.soPhong != null ? item.soPhong : item.soPhong()}]] không?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa phòng">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <!-- Trường hợp danh sách rỗng -->
                    <tr th:if="${#lists.isEmpty(dsPhong)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="fas fa-folder-open fa-2x mb-2 d-block"></i>
                            Chưa có dữ liệu phòng nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ==================== POP-UP MODAL FORM (THÊM / SỬA PHÒNG) ==================== -->
<div class="modal fade" id="phongModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="modalTitle">Thêm phòng mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="phongForm" method="post">
                <div class="modal-body p-4 row g-3">

                    <!-- Số phòng -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Số phòng <span class="text-danger">*</span></label>
                        <input type="text" id="soPhong" name="soPhong" class="form-control" placeholder="Ví dụ: 101" required>
                    </div>

                    <!-- Dropdown chọn Loại phòng -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Loại phòng <span class="text-danger">*</span></label>
                        <select id="maLoaiPhong" name="maLoaiPhong" class="form-select" required>
                            <option value="">-- Chọn loại phòng --</option>
                            <option th:each="loai : ${dsLoaiPhong}"
                                    th:value="${loai.maLoai != null ? loai.maLoai : loai.maLoai()}"
                                    th:text="${loai.tenLoai != null ? loai.tenLoai : loai.tenLoai()}">
                                Loại đơn
                            </option>
                        </select>
                    </div>

                    <!-- Tầng -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tầng</label>
                        <input type="number" id="tang" name="tang" class="form-control" min="1" placeholder="Ví dụ: 1">
                    </div>

                    <!-- Trạng thái -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Trạng thái phòng</label>
                        <select id="trangThaiPhong" name="trangThaiPhong" class="form-select">
                            <option value="TRONG">Trống</option>
                            <option value="DA_DAT">Đã đặt</option>
                            <option value="DANG_O">Đang ở</option>
                            <option value="BAO_TRI">Bảo trì</option>
                        </select>
                    </div>

                    <!-- Ghi chú -->
                    <div class="col-12">
                        <label class="form-label fw-semibold">Ghi chú</label>
                        <textarea id="ghiChu" name="ghiChu" class="form-control" rows="3" placeholder="Nhập ghi chú..."></textarea>
                    </div>

                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="submit" class="btn btn-primary fw-semibold"><i class="fas fa-save me-1"></i> Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script xử lý Pop-up Modal -->
<script>
    let modalInstance;

    document.addEventListener("DOMContentLoaded", function () {
        modalInstance = new bootstrap.Modal(document.getElementById('phongModal'));
    });

    // Mở Modal Thêm mới
    function openCreateModal() {
        document.getElementById('modalTitle').innerText = "Thêm phòng mới";
        document.getElementById('phongForm').action = "/admin/phong/create";

        document.getElementById('soPhong').value = '';
        document.getElementById('maLoaiPhong').value = '';
        document.getElementById('tang').value = '';
        document.getElementById('trangThaiPhong').value = 'TRONG';
        document.getElementById('ghiChu').value = '';

        modalInstance.show();
    }

    // Mở Modal Chỉnh sửa (lấy an toàn từ data-* attributes)
    function openEditModalFromBtn(btn) {
        const id = btn.getAttribute('data-id');
        const soPhong = btn.getAttribute('data-so-phong');
        const maLoai = btn.getAttribute('data-ma-loai');
        const tang = btn.getAttribute('data-tang');
        const trangThai = btn.getAttribute('data-trang-thai');
        const ghiChu = btn.getAttribute('data-ghi-chu');

        document.getElementById('modalTitle').innerText = "Cập nhật phòng #" + (soPhong || id);
        document.getElementById('phongForm').action = "/admin/phong/edit/" + id;

        document.getElementById('soPhong').value = soPhong || '';
        document.getElementById('maLoaiPhong').value = maLoai || '';
        document.getElementById('tang').value = tang || '';
        document.getElementById('trangThaiPhong').value = trangThai || 'TRONG';
        document.getElementById('ghiChu').value = ghiChu || '';

        modalInstance.show();
    }
</script>
</body>
</html>
