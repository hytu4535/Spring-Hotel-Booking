<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:inline="text">

<aside class="staff-sidebar" th:fragment="sidebar">
    <div class="staff-sidebar-header">
        <a th:href="@{/staff/quan-ly-don}" class="staff-brand">
            <i class="bi bi-building-check"></i>
            <span>HotelBooking</span>
        </a>
        <div class="staff-user">
            <i class="bi bi-person-circle"></i>
            <span>[[${session.currentUser.hoTen}]]</span>
        </div>
        <span class="staff-role">LỄ TÂN / NHÂN VIÊN</span>
    </div>

    <nav class="staff-sidebar-menu" aria-label="Điều hướng nghiệp vụ">
        <div class="staff-section-label">Vận hành hằng ngày</div>
        <a class="[[${activeMenu == 'overview' ? 'active' : ''}]]" th:href="@{/staff/quan-ly-don}">
            <i class="bi bi-house"></i><span>Tổng quan</span>
        </a>
        <a class="[[${activeMenu == 'reservations' ? 'active' : ''}]]" th:href="@{/staff/don}">
            <i class="bi bi-calendar-check"></i><span>Đặt phòng & đơn đặt</span>
        </a>
        <a class="[[${activeMenu == 'frontdesk' ? 'active' : ''}]]" th:href="@{/staff/nhan-tra-phong}">
            <i class="bi bi-person-workspace"></i><span>Quầy lễ tân</span>
        </a>

        <div class="staff-section-label staff-section-label-spaced">Tài khoản</div>
        <a class="[[${activeMenu == 'profile' ? 'active' : ''}]]" th:href="@{/staff/profile}">
            <i class="bi bi-person"></i><span>Hồ sơ cá nhân</span>
        </a>
        <a class="[[${activeMenu == 'password' ? 'active' : ''}]]" th:href="@{/staff/doi-mat-khau}">
            <i class="bi bi-key"></i><span>Đổi mật khẩu</span>
        </a>
    </nav>

    <div class="staff-sidebar-footer">
        <a th:href="@{/logout}" class="btn btn-danger w-100">
            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
        </a>
    </div>
</aside>
</html>
