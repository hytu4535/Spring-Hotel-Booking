<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi" th:fragment="header">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${param.title != null ? param.title + ' - Hệ thống đặt phòng' : 'Hotel Booking - Hệ thống đặt phòng'}">
        Hotel Booking - Hệ thống đặt phòng
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-building"></i> Hotel Booking
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <th:block th:if="${session.currentUser != null and session.currentUser.vaiTro == 'CUSTOMER'}">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> [[${session.currentUser.hoTen}]]
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/customer/profile}">Hồ sơ của tôi</a></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/logout}">Đăng xuất</a></li>
                        </ul>
                    </li>
                </th:block>
                <li class="nav-item">
                    <a class="nav-link" href="/">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tim-phong}">Tìm phòng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tra-cuu-don}">Tra cứu đơn</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <th:block th:unless="${session.currentUser}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/login}">
                            <i class="bi bi-person"></i> Đăng nhập</a></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
<main class="container my-4">
