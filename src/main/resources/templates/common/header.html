<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text" lang="vi" th:fragment="header">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${param.title != null ? param.title + ' - Hệ thống đặt phòng' : 'Hotel Booking - Hệ thống đặt phòng'}">
        Hotel Booking - Hệ thống đặt phòng
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <div class="top-bar">
        <div class="container d-flex align-items-center justify-content-between">
            <span><i class="bi bi-telephone-fill me-2"></i>+84 283 811 0910</span>
            <span class="d-none d-md-inline">Trải nghiệm lưu trú đẳng cấp với không gian sang trọng và yên tĩnh</span>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top site-nav">
        <div class="container">
            <a class="navbar-brand" href="/">
                Hotel <span>Booking</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-lg-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tim-phong}">Phòng lưu trú</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tra-cuu-don}">Tra cứu đơn</a>
                    </li>
                    <th:block th:if="${session.currentUser != null and session.currentUser.vaiTro == 'CUSTOMER'}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/customer/profile}">Hồ sơ</a>
                        </li>
                    </th:block>
                </ul>
                <ul class="navbar-nav align-items-lg-center">
                    <th:block th:if="${session.currentUser != null and session.currentUser.vaiTro == 'CUSTOMER'}">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle me-1"></i> [[${session.currentUser.hoTen}]]
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" th:href="@{/customer/profile}">Thông tin tài khoản</a></li>
                                <li><a class="dropdown-item text-danger" th:href="@{/logout}">Đăng xuất</a></li>
                            </ul>
                        </li>
                    </th:block>
                    <th:block th:if="${session.currentUser == null}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/login}">Đăng nhập</a></li>
                    </th:block>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-brand" th:href="@{/tim-phong}">Đặt phòng</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="site-main">
