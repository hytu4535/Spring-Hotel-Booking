<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/assets/css/admin.css}"></head><body><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="main-content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Quản lý phòng</h1><p class="text-muted">Theo dõi số phòng, tầng và trạng thái sử dụng.</p></div><a class="btn btn-primary" th:href="@{/admin/phong/them}"><i class="fas fa-plus"></i> Thêm phòng</a></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Số phòng</th><th>Tầng</th><th>Loại phòng</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="p : ${phongList}"><td class="fw-semibold" th:text="${p.soPhong}"></td><td th:text="${p.tang}"></td><td th:text="${p.loaiPhong.tenLoai}"></td><td><span class="badge bg-info text-dark" th:text="${p.trangThai}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/phong/{id}/sua(id=${p.maPhong})}">Sửa</a><form class="d-inline" method="post" th:action="@{/admin/phong/{id}/xoa(id=${p.maPhong})}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr></tbody></table></div></div></main></body></html>
