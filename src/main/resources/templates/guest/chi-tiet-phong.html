<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/style.css}"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">Hotel Booking</a><a class="btn btn-outline-light btn-sm" th:href="@{/gio-hang}"><i class="bi bi-cart"></i> Giỏ hàng</a></div></nav>
<main class="container py-5"><a class="text-decoration-none" th:href="@{/tim-phong(ngayNhan=${ngayNhan},ngayTra=${ngayTra})}">← Quay lại danh sách phòng</a><div class="row justify-content-center mt-4"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><span class="badge bg-success mb-3">Phòng còn trống</span><h1 class="h2" th:text="'Phòng ' + ${phong.soPhong}">Phòng</h1><p class="lead text-muted" th:text="${phong.tenLoai}">Loại phòng</p><hr><div class="row mb-4"><div class="col-sm-6"><small class="text-muted">Giá phòng</small><h2 class="h4 text-primary" th:text="${phong.giaPhong} + ' đ / đêm'">Giá</h2></div><div class="col-sm-6"><small class="text-muted">Thời gian lưu trú</small><p class="mb-0" th:text="${ngayNhan} + ' → ' + ${ngayTra}">Ngày</p></div></div><form th:action="@{/gio-hang}" method="post"><input type="hidden" name="maPhong" th:value="${phong.maPhong}"><input type="hidden" name="soPhong" th:value="${phong.soPhong}"><input type="hidden" name="tenLoai" th:value="${phong.tenLoai}"><input type="hidden" name="giaPhong" th:value="${phong.giaPhong}"><input type="hidden" name="ngayNhan" th:value="${ngayNhan}"><input type="hidden" name="ngayTra" th:value="${ngayTra}"><button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-cart-plus"></i> Thêm vào giỏ hàng</button></form></div></div></div></div></main></body></html>
