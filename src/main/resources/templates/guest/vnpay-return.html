<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả thanh toán | Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 640px">
        <div class="card-body p-4 p-md-5 text-center">
            <h1 class="h3 mb-3" th:text="${status == 'SUCCESS' ? 'Thanh toán thành công' : 'Thanh toán chưa hoàn tất'}"></h1>
            <p class="text-muted" th:text="${message}"></p>
            <p th:if="${maTraCuu}">Mã tra cứu: <strong th:text="${maTraCuu}"></strong></p>
            <a class="btn btn-primary" th:href="@{/tra-cuu-don}">Tra cứu đơn đặt phòng</a>
            <a class="btn btn-outline-secondary ms-2" th:href="@{/}">Về trang chủ</a>
        </div>
    </div>
</main>
</body>
</html>
