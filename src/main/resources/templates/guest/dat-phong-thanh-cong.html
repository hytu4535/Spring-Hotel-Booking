<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text">
<div th:replace="~{common/header :: header}"></div>

<section class="container py-5">
    <div class="soft-card p-4 p-lg-5 text-center mx-auto" style="max-width: 760px;">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 4.5rem;"></i>
        <h2 class="mt-3 mb-2">Đặt phòng thành công</h2>
        <p class="text-muted mb-4">Cảm ơn bạn đã lựa chọn dịch vụ. Chúng tôi đã ghi nhận thông tin đặt phòng của bạn.</p>

        <div class="alert alert-warning fs-5">
            Mã tra cứu của bạn:
            <div class="fs-2 fw-bold text-danger mt-1">[[${session.maTraCuu}]]</div>
        </div>

        <p class="mb-4">
            Vui lòng lưu mã tra cứu cùng email
            <strong>[[${session.emailDatPhong}]]</strong>
            để theo dõi trạng thái đơn hàng.
        </p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <a th:href="@{/tra-cuu-don}" class="btn btn-cta px-4">Đến trang tra cứu</a>
            <a href="/" class="btn btn-outline-dark px-4">Về trang chủ</a>
        </div>
    </div>
</section>

<div th:replace="~{common/footer :: footer}"></div>
</html>
