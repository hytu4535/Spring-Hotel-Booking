<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giỏ hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/style.css}"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">Hotel Booking</a><a class="btn btn-outline-light btn-sm" th:href="@{/tim-phong}">Tìm phòng</a></div></nav>
<main class="container py-5"><h1 class="h2 mb-4">Giỏ phòng đã chọn</h1><div th:if="${session.cart == null || session.cart.items.empty}" class="card border-0 shadow-sm"><div class="card-body text-center py-5"><i class="bi bi-cart-x display-4 text-muted"></i><p class="lead mt-3">Giỏ hàng đang trống.</p><a class="btn btn-primary" th:href="@{/tim-phong}">Tìm phòng ngay</a></div></div><div th:if="${session.cart != null && !session.cart.items.empty}" class="row g-4"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Phòng</th><th>Loại phòng</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead><tbody><tr th:each="item : ${session.cart.items}"><td class="fw-semibold" th:text="${item.soPhong}"></td><td th:text="${item.tenLoai}"></td><td th:text="${item.giaPhong}"></td><td class="text-primary fw-semibold" th:text="${item.thanhTien}"></td><td><a class="btn btn-sm btn-outline-danger" th:href="@{/gio-hang(action='remove',maPhong=${item.maPhong})}"><i class="bi bi-trash"></i></a></td></tr></tbody></table></div></div></div><div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Tóm tắt đặt phòng</h2><p class="mb-1">Nhận phòng: <strong th:text="${session.cart.ngayNhan}"></strong></p><p>Trả phòng: <strong th:text="${session.cart.ngayTra}"></strong></p><hr><div class="d-flex justify-content-between"><span>Tổng tiền</span><strong class="text-primary" th:text="${session.cart.tongTien}"></strong></div><a class="btn btn-success w-100 mt-3" th:href="@{/dat-phong}">Tiếp tục đặt phòng</a></div></div></div></div></main></body></html>
