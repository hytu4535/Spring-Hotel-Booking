<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt phòng khách sạn - Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-building"></i> Hotel Booking</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/gioi-thieu}">Giới thiệu</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/tra-cuu-don}">Tra cứu đơn</a>
            <a class="btn btn-light btn-sm" th:if="${session.currentUser == null}" th:href="@{/login}">Đăng nhập</a>
            <a class="btn btn-light btn-sm" th:if="${session.currentUser != null}" th:href="@{/customer/profile}">Tài khoản</a>
            <a class="btn btn-warning btn-sm" th:if="${session.currentUser != null}" th:href="@{/logout}">Đăng xuất</a>
        </div>
    </div>
</nav>
<main>
    <section class="hero-section">
        <div class="container text-center">
            <h1 class="display-5 fw-bold">Đặt phòng khách sạn dễ dàng</h1>
            <p class="lead mb-0">Tìm phòng phù hợp nhanh chóng, thuận tiện và an toàn.</p>
        </div>
    </section>
    <div class="container pb-5">
        <div class="card border-0 shadow-sm mx-auto" style="max-width: 900px">
            <div class="card-body p-4">
                <h2 class="h4 text-center mb-4">Tìm phòng trống</h2>
                <form th:action="@{/tim-phong}" method="get" class="row g-3 justify-content-center">
                    <div class="col-md-4"><label class="form-label" for="ngayNhan">Ngày nhận phòng</label><input id="ngayNhan" type="date" name="ngayNhan" class="form-control" required></div>
                    <div class="col-md-4"><label class="form-label" for="ngayTra">Ngày trả phòng</label><input id="ngayTra" type="date" name="ngayTra" class="form-control" required></div>
                    <div class="col-md-3 d-flex align-items-end"><button class="btn btn-warning w-100" type="submit"><i class="bi bi-search"></i> Tìm phòng</button></div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
