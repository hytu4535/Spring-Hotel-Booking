<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tìm phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/style.css}"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-building"></i> Hotel Booking</a><a class="btn btn-outline-light btn-sm" th:href="@{/gio-hang}"><i class="bi bi-cart"></i> Giỏ hàng</a></div></nav>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Tìm phòng trống</h1><p class="text-muted mb-0">Chọn thời gian lưu trú để xem phòng còn trống.</p></div><a th:href="@{/}" class="btn btn-outline-secondary">Trang chủ</a></div>
<div class="card border-0 shadow-sm mb-4"><div class="card-body"><form th:action="@{/tim-phong}" method="get" class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Ngày nhận phòng</label><input class="form-control" type="date" name="ngayNhan" th:value="${ngayNhan}" required></div><div class="col-md-4"><label class="form-label">Ngày trả phòng</label><input class="form-control" type="date" name="ngayTra" th:value="${ngayTra}" required></div><div class="col-md-2"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Tìm phòng</button></div></form><div class="alert alert-danger mt-3 mb-0" th:if="${error}" th:text="${error}"></div></div></div>
<div class="row g-4"><div class="col-md-6 col-xl-4" th:each="phong : ${danhSachPhong}"><div class="card h-100 border-0 shadow-sm room-card"><div class="card-body"><span class="badge bg-success mb-2">Còn trống</span><h2 class="h5" th:text="'Phòng ' + ${phong.soPhong}">Phòng</h2><p class="text-muted" th:text="${phong.tenLoai}">Loại phòng</p><div class="d-flex justify-content-between align-items-center"><strong class="text-primary" th:text="${phong.giaPhong} + ' đ / đêm'">Giá</strong><a class="btn btn-outline-primary" th:href="@{/chi-tiet-phong(maPhong=${phong.maPhong},ngayNhan=${ngayNhan},ngayTra=${ngayTra})}">Xem chi tiết</a></div></div></div></div><div class="col-12" th:if="${#lists.isEmpty(danhSachPhong) and ngayNhan != null}"><div class="alert alert-info">Không tìm thấy phòng phù hợp trong khoảng thời gian đã chọn.</div></div></div></main></body></html>
