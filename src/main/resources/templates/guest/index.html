<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Hệ Thống Đặt Phòng</title>
</head>
<body>

<!-- Nhúng Header Fragment -->
<div th:replace="~{common/header :: header}"></div>

<section class="hero-section text-center py-5 bg-primary text-white mb-5">
    <div class="container py-4">
        <h1 class="display-5 fw-bold mb-3">Đặt phòng khách sạn dễ dàng</h1>
        <p class="lead mb-4">Tìm phòng trống nhanh chóng – Không cần đăng ký tài khoản</p>

        <form th:action="@{/tim-phong}" method="get" class="row g-3 justify-content-center">
            <div class="col-md-3">
                <label class="form-label text-white fw-semibold">Ngày nhận phòng</label>
                <input type="date" name="ngayNhan" class="form-control form-control-lg" required>
            </div>
            <div class="col-md-3">
                <label class="form-label text-white fw-semibold">Ngày trả phòng</label>
                <input type="date" name="ngayTra" class="form-control form-control-lg" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">
                    <i class="bi bi-search me-1"></i> Tìm phòng
                </button>
            </div>
        </form>
    </div>
</section>

<div class="container mb-5">
    <div class="row text-center g-4">
        <div class="col-md-4">
            <i class="bi bi-calendar-check display-4 text-primary"></i>
            <h5 class="mt-3 fw-bold">Đặt phòng nhanh</h5>
            <p class="text-muted">Chỉ cần chọn ngày và điền thông tin</p>
        </div>
        <div class="col-md-4">
            <i class="bi bi-shield-check display-4 text-primary"></i>
            <h5 class="mt-3 fw-bold">An toàn & Bảo mật</h5>
            <p class="text-muted">Thông tin của bạn được bảo vệ</p>
        </div>
        <div class="col-md-4">
            <i class="bi bi-search display-4 text-primary"></i>
            <h5 class="mt-3 fw-bold">Tra cứu đơn dễ dàng</h5>
            <p class="text-muted">Dùng mã tra cứu + email</p>
        </div>
    </div>
</div>

<!-- Nhúng Footer Fragment -->
<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
