<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xác nhận đặt phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/style.css}"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">Hotel Booking</a><a class="btn btn-outline-light btn-sm" th:href="@{/gio-hang}">← Giỏ hàng</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><h1 class="h3 mb-2">Thông tin đặt phòng</h1><p class="text-muted mb-4">Vui lòng nhập thông tin liên hệ để chúng tôi xác nhận đơn.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/dat-phong}" method="post"><div class="mb-3"><label class="form-label">Họ tên <span class="text-danger">*</span></label><input name="hoTen" class="form-control" th:value="${hoTen}" required></div><div class="mb-3"><label class="form-label">Email <span class="text-danger">*</span></label><input name="email" type="email" class="form-control" th:value="${email}" required></div><div class="mb-4"><label class="form-label">Số điện thoại</label><input name="soDienThoai" class="form-control" th:value="${soDienThoai}"></div><div class="d-flex justify-content-between"><a class="btn btn-outline-secondary" th:href="@{/gio-hang}">Quay lại</a><button class="btn btn-success" type="submit"><i class="bi bi-check-circle"></i> Xác nhận đặt phòng</button></div></form></div></div></div></div></main></body></html>
