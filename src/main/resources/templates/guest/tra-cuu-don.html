<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/assets/css/style.css}"><meta charset="UTF-8"><title>Tra cứu đơn</title></head><body><main class="container py-4"><h1>Tra cứu đơn đặt phòng</h1><form th:action="@{/tra-cuu-don}" method="post"><input type="hidden" name="action" value="search"><input name="maTraCuu" placeholder="Mã tra cứu" th:value="${maTraCuuInput}" required><input name="email" type="email" placeholder="Email" th:value="${emailInput}" required><button>Tìm</button></form><p th:if="${error}" th:text="${error}"></p><section th:if="${donDatPhong}"><h2>Đơn hàng</h2><p th:text="${donDatPhong.maDp}"></p><form th:action="@{/tra-cuu-don}" method="post"><input type="hidden" name="action" value="cancel"><input type="hidden" name="maDp" th:value="${donDatPhong.maDp}"><button>Hủy đơn</button></form></section></main></body></html>
