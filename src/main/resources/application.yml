spring:
  config:
    import: optional:classpath:db.properties
  datasource:
    url: ${DB_URL:${db.url}}
    username: ${DB_USERNAME:${db.username}}
    password: ${DB_PASSWORD:${db.password}}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update          # dev: update | prod: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope: profile, email

server:
  port: 8080

app:
  frontend-url: http://localhost:8080