spring:
  config:
    import:
      - optional:classpath:db.properties
      - optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:${db.url}}
    username: ${DB_USERNAME:${db.username}}
    password: ${DB_PASSWORD:${db.password}}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update          # dev: update | prod: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope: profile, email

server:
  port: 8080

app:
  frontend-url: http://localhost:8080
  oauth:
    google-url: ${GOOGLE_OAUTH_URL:}
    facebook-url: ${FACEBOOK_OAUTH_URL:}
    google-client-id: ${GOOGLE_CLIENT_ID:mock_google_client_id}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:mock_google_client_secret}
    facebook-client-id: ${FACEBOOK_CLIENT_ID:mock_facebook_client_id}
    facebook-client-secret: ${FACEBOOK_CLIENT_SECRET:mock_facebook_client_secret}
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}